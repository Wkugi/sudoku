    undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M19 20v-6a5 5 0 0 0-5-5H7"/><path d="M3 9l5-4v8z" fill="currentColor" stroke="none"/></svg>',
    restart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M17.5 7.5A8 8 0 1 0 20 13"/><path d="M20 3v6h-6" fill="none"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L23 21H1z"/><rect x="11" y="9" width="2" height="6" fill="#1e1e1e"/><rect x="11" y="16.5" width="2" height="2" fill="#1e1e1e"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="18" rx="1.5"/><rect x="8" y="2" width="8" height="4" fill="currentColor"/><path d="M8 13l3 3 5-6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 21l1.5-5L16 4.5l3.5 3.5L8 19.5z"/></svg>',
    eraser: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 15l9-9 7 7-6 6H7z"/><path d="M8 10l7 7" /></svg>',
  };
  $("btnPrint").innerHTML = ICONS.print;
  $("btnHat").innerHTML = ICONS.hat;
  $("btnUndo").innerHTML = ICONS.undo;
  $("btnRestart").innerHTML = ICONS.restart;
  $("btnWarn").innerHTML = ICONS.warn;
  $("btnCheck").innerHTML = ICONS.check;

  function btn(html, cls, onTap, onRight) {
    const b = document.createElement("button");
    b.innerHTML = html;
    if (cls) b.className = cls;
    b.addEventListener("click", (e) => { e.preventDefault(); onTap && onTap(e); });
    if (onRight) b.addEventListener("contextmenu", (e) => { e.preventDefault(); onRight(e); });
    return b;
  }

  function renderBars() {
    const g = S.game;
    const sel = S.selected;
    const selVal = sel !== null ? g.values[sel] : 0;
    const selNotes = sel !== null ? g.notes[sel] : 0;
    const count = (d) => g.digitCount(d);

    if (S.regionMode) {
      const sizes = g.regionSizes();
      const make = (target) => {
        target.innerHTML = "";
        for (let k = 0; k < 9; k++) {
          const b = btn(`${k + 1}<small style="color:${sizes[k] === 9 ? "#555" : "#c62828"}">${sizes[k]} F.</small>`,
            "", () => { S.paintRegion = k; regionStatus(); render(); });
          b.style.background = REGION_COLORS[k];
          if (k === S.paintRegion) b.style.outline = "3px solid #2b2b2b";
          target.appendChild(b);
        }
        const fb = btn("Fertig<small>malen</small>", "mode-on", toggleRegionMode);
        fb.style.fontSize = "13px";
        target.appendChild(fb);
        if (target.id === "barMouse") target.appendChild(btn("", "rowlabel"));
      };
      make($("barMouse")); make($("barValues"));
      return;
    }
    // Maus-Leiste (wie PC): 1-9, Notiz, Löschen
    const bm = $("barMouse");
    bm.innerHTML = "";
    for (let d = 1; d <= 9; d++) {
      const done = count(d) >= 9 && !g.editing;
      let cls = done ? "done" : "";
      if (d === selVal) cls += " sel";
      else if (S.noteMode && (selNotes >> d & 1)) cls += " note-on";
      const cnt = g.editing ? "" : `<span class="cnt">${Math.max(0, 9 - count(d))}</span>`;
      bm.appendChild(btn(`${d}${cnt}`, cls, () => inputDigit(d, S.noteMode), () => inputDigit(d, true)));
    }
    bm.appendChild(btn(`${ICONS.pencil}<small>Notiz</small>`, S.noteMode ? "mode-on" : "", toggleNoteMode));
    bm.appendChild(btn(`${ICONS.eraser}<small>Löschen</small>`, "", erase));

    // Touch: kleine Notiz-Reihe oben, große Zahlen-Reihe unten
    const bn = $("barNotes");
    bn.innerHTML = "";
    for (let d = 1; d <= 9; d++) {
      const on = sel !== null && !selVal && (selNotes >> d & 1);
      bn.appendChild(btn(String(d), on ? "note-on" : "", () => inputDigit(d, true)));
    }
    bn.appendChild(btn("Notiz", "rowlabel"));
    const bv = $("barValues");
    bv.innerHTML = "";
    for (let d = 1; d <= 9; d++) {
      const done = count(d) >= 9 && !g.editing;
      let cls = done ? "done" : "";
      if (d === selVal) cls += " sel";
      const cnt = g.editing ? "" : `<span class="cnt">${Math.max(0, 9 - count(d))}</span>`;
      bv.appendChild(btn(`${d}${cnt}`, cls, () => inputDigit(d, false)));
    }
    bv.appendChild(btn(ICONS.eraser, "", erase));
  }

  function renderTools() {
    const g = S.game;
    $("btnHat").disabled = g.editing;
    $("btnRestart").disabled = g.editing;
    $("btnWarn").disabled = g.editing;
    $("btnWarn").classList.toggle("active", S.showErrors);
    const p = $("btnPause");
    if (g.editing) { p.textContent = "Fertig"; p.classList.add("active"); p.title = "Eingabe abschließen"; }
    else { p.textContent = S.paused ? "Weiter" : "Pause"; p.classList.remove("active"); p.title = "Pause / Weiter (P)"; }
    $("timer").textContent = g.editing ? "Eingabe" : fmtTime(g.elapsed);
    const eb = $("btnRegions");
    eb.style.display = g.editRegions ? "" : "none";
    eb.classList.toggle("active", S.regionMode);
    eb.textContent = S.regionMode ? "Fertig malen" : "Gebiete malen";
    const db = $("btnDiag");
    db.classList.toggle("active", g.editDiagonals);
    db.textContent = g.editDiagonals ? "✓ Diagonalen" : "Diagonalen";
    const cb = $("btnColors");
    cb.style.display = g.editRegions ? "none" : "";
    cb.classList.toggle("active", g.editColors);
    cb.textContent = g.editColors ? "✓ Farben" : "Farben";
  }

  function statusPrefix() {
    const g = S.game, kind = g.kind();
    if (g.editing) return kind === "Sudoku" ? "Eigenes Rätsel eingeben" : `Eigenes ${kind} eingeben`;
    const name = g.level ? LEVELS[g.level] : "";
    if (kind !== "Sudoku") return name ? `${kind} · ${name}` : kind;
    return name;
  }
  function renderStatus() {
    const pre = statusPrefix();
    $("title").innerHTML = `Sudoku${pre ? ` <span>· ${pre}</span>` : ""}`;
    document.title = pre ? `Sudoku – ${pre}` : "Sudoku";
    $("status").textContent = S.statusMsg;
    $("status").title = S.statusMsg;
    $("status").classList.toggle("link", !!S.hintTech && S.statusMsg.startsWith("Tipp:"));
  }
  function status(msg) { S.statusMsg = msg; renderStatus(); }

  function render() {
    drawBoard();
    renderBars();
    renderTools();
    renderStatus();
  }

  // ---------------------------------------------------------------- Timer
  setInterval(() => {
    const now = performance.now();
    const g = S.game;
    const running = !(S.paused || S.generating || g.finished || g.editing || document.hidden);
    if (running) g.elapsed += (now - S.lastTick) / 1000;
    S.lastTick = now;
    $("timer").textContent = g.editing ? "Eingabe" : fmtTime(g.elapsed);
  }, 250);

  // ---------------------------------------------------------------- Dialoge
  const overlay = $("overlay");
  function dialog(html, buttons = [{ label: "OK", primary: true }], { cls = "dlg", onOpen } = {}) {
    return new Promise((resolve) => {
      overlay.innerHTML = "";
      const d = document.createElement("div");
      d.className = cls;
      d.innerHTML = html;
      if (buttons.length) {
        const row = document.createElement("div");
        row.className = "btns";
        for (const b of buttons) {
          const el = document.createElement("button");
          el.textContent = b.label;
          if (b.primary) el.className = "primary";
          el.onclick = () => { close(); resolve(b.value !== undefined ? b.value : b.label); };
          row.appendChild(el);
        }
        d.appendChild(row);
      }
      overlay.appendChild(d);
      overlay.classList.add("on");
      overlay.onclick = (e) => { if (e.target === overlay) { close(); resolve(null); } };
      d._resolve = (v) => { close(); resolve(v); };
      if (onOpen) onOpen(d);
    });
  }
  function close() { overlay.classList.remove("on"); overlay.innerHTML = ""; }
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const info = (title, text) => dialog(`<h2>${esc(title)}</h2><pre>${esc(text)}</pre>`);
  const confirmDlg = (title, text, yes = "Ja", no = "Abbrechen") =>
    dialog(`<h2>${esc(title)}</h2><p>${esc(text)}</p>`, [{ label: no, value: false }, { label: yes, primary: true, value: true }]);

  // ---------------------------------------------------------------- Aktionen
  function playable() {
    if (S.generating || S.paused) return false;
    if (S.game.finished) { status("Das Spiel ist beendet – neues Spiel über das Menü ☰."); return false; }
    return true;
  }

  function inputDigit(d, asNote) {
    if (S.regionMode || !playable()) return;
    const g = S.game, i = S.selected;
    if (i === null) { status("Bitte zuerst ein Feld antippen."); return; }
    if (g.givens[i]) { status("Vorgegebene Zahlen können nicht geändert werden."); return; }
    let changed;
    if (asNote && !g.editing) {
      if (g.values[i]) { status("Im Feld steht schon eine Zahl – erst löschen, dann Notizen setzen."); return; }
      changed = g.toggleNote(i, d);
    } else changed = g.setValue(i, d);
    if (changed) { S.unsure.delete(i); afterChange(); }
  }

  function erase() {
    if (S.regionMode || !playable() || S.selected === null) return;
    if (S.game.clearCell(S.selected)) { S.unsure.delete(S.selected); afterChange(); }
  }

  function afterChange(msg = "") {
    S.hintCell = null;
    const g = S.game;
    if (g.editing && !msg) msg = "Vorgaben eintragen, dann „Fertig“.";
    S.statusMsg = msg;
    if (!g.editing && !g.finished && g.isSolved()) {
      g.finished = true;
      render(); autosave();
      status(`Gelöst in ${fmtTime(g.elapsed)}!`);
      info("Gelöst!", `Glückwunsch – ${g.kind() === "Sudoku" ? "Sudoku" : g.kind()} gelöst in ${fmtTime(g.elapsed)}.`);
      return;
    }
    render();
    autosave();
  }

  function toggleNoteMode() {
    S.noteMode = !S.noteMode;
    status(S.noteMode ? "Notizmodus EIN – Zahlen werden als Notiz eingetragen." : "Notizmodus AUS.");
    render();
  }

  function togglePause() {
    const g = S.game;
    if (g.editing || g.finished || S.generating) return;
    S.paused = !S.paused;
    S.statusMsg = S.paused ? "Pausiert." : "";
    render();
  }

  function undo() { if (S.game.undo()) afterChange("Rückgängig."); }
  function redo() { if (S.game.redo()) afterChange("Wiederholt."); }

  async function restart() {
    const g = S.game;
    if (g.editing || S.generating) return;
    if (g.hasProgress() && !(await confirmDlg("Neustart", "Alle eigenen Eingaben und Notizen löschen und die Zeit zurücksetzen?"))) return;
    g.reset(); S.paused = false;
    afterChange("Rätsel neu gestartet.");
  }

  function toggleErrors() {
    const g = S.game;
    if (g.editing) return;
    S.showErrors = !S.showErrors;
    if (S.showErrors) {
      const n = new Set([...g.wrongCells(), ...g.conflicts()]).size;
      status(n ? `${n} fehlerhafte(s) Feld(er) markiert.` : "Keine Fehler gefunden.");
    } else status("Fehleranzeige aus.");
    render();
  }

  async function check() {
    const g = S.game;
    if (g.editing) { finishEdit(); return; }
    if (g.isSolved()) { info("Prüfen", "Alles richtig – das Sudoku ist gelöst!"); return; }
    const wrong = new Set([...g.wrongCells(), ...g.conflicts()]).size, empty = g.emptyCount();
    if (wrong) {
      if (await confirmDlg("Prüfen", `${wrong} Feld(er) sind falsch, ${empty} Feld(er) noch leer. Fehler jetzt anzeigen?`, "Anzeigen", "Nein")) {
        S.showErrors = true; render();
      }
    } else info("Prüfen", `Bisher alles richtig. Noch ${empty} Feld(er) leer.`);
  }

  function hint() {
    if (!playable()) return;
    const g = S.game;
    const wrong = new Set([...g.wrongCells(), ...g.conflicts()]);
    if (wrong.size) { S.showErrors = true; render(); status(`Zuerst ${wrong.size} fehlerhafte(s) Feld(er) korrigieren (rot markiert).`); return; }
    const h = C.findHint(g.values, g.layout);
    if (!h) { status("Mit den eingebauten Techniken kein Schritt gefunden – „Feld aufdecken“ hilft weiter."); return; }
    S.selected = h.cell; S.hintCell = h.cell;
    S.hintTech = techForHint(h);
    render();
    status("Tipp: " + h.text + (S.hintTech ? "  ⓘ Erklärung" : ""));
  }
  function revealCell() {
    if (!playable()) return;
    if (S.selected === null) { status("Bitte zuerst ein Feld antippen."); return; }
    if (S.game.reveal(S.selected)) afterChange(`Aufgedeckt: ${C.cellName(S.selected)}.`);
  }
  function fillCandidates() { if (playable() && !S.game.editing && S.game.fillCandidates()) afterChange("Kandidaten eingetragen."); }
  function clearNotes() { if (playable() && !S.game.editing && S.game.clearNotes()) afterChange("Alle Notizen gelöscht."); }
  async function showSolution() {
    if (!playable()) return;
    if (await confirmDlg("Lösung anzeigen", "Lösung anzeigen und das Spiel beenden?", "Anzeigen")) {
      S.game.showSolution(); S.showErrors = false; render(); autosave(); status("Lösung angezeigt.");
    }
  }

  function hatMenu() {
    if (S.game.editing) return;
    const items = [["Tipp: nächster logischer Schritt", hint], ["Ausgewähltes Feld aufdecken", revealCell],
      ["Kandidaten automatisch eintragen", fillCandidates], ["Alle Notizen löschen", clearNotes],
      ["Wiederholen (Strg+Y)", redo], ["Lösung anzeigen", showSolution], ["Lösungstechniken erklärt", () => techDialog()]];
    dialog(`<h2>Hilfen</h2><div class="menu" style="display:grid;gap:6px" id="hatItems"></div>`,
      [{ label: "Schließen" }], {
        onOpen: (d) => {
          const box = d.querySelector("#hatItems");
          for (const [label, fn] of items) {
            const b = document.createElement("button");
            b.textContent = label;
            b.onclick = () => { d._resolve(null); fn(); };
            box.appendChild(b);
          }
        },
      });
  }

  // ---------------------------------------------------------------- Neues Spiel
  async function confirmDiscard() {
    const g = S.game;
    if (g.editing || (g.hasProgress() && !g.finished)) return confirmDlg("Neues Spiel", "Das aktuelle Spiel verwerfen?", "Verwerfen");
    return true;
  }

  async function newGame(level, squiggly, diagonals, colors = false, confirm = true) {
    if (S.generating) return;
    if (confirm && !(await confirmDiscard())) return;
    let kind = squiggly ? (diagonals ? "Squiggly-X" : "Squiggly") : new C.Layout(null, diagonals, colors).kind;
    if (kind === "Sudoku") kind = "Rätsel";
    S.generating = true; S.paused = false; S.regionMode = false;
    S.statusMsg = `Erzeuge ${kind} (${LEVELS[level]}) …`;
    if (S.game.editing) S.game.cancelEditing();
    layout(); render();
    setTimeout(() => {
      const r = C.generate(level, { squiggly, diagonals, colors });
      S.game.loadPuzzle(r.puzzle, r.solution, r.level, r.layout);
      S.generating = false; S.selected = null; S.hintCell = null; S.showErrors = false; S.hover = null;
      S.lastTick = performance.now();
      let msg = `Neues ${kind} mit ${r.puzzle.filter(v => v).length} Vorgaben.`;
      if (r.level !== level) msg += ` (Gewünscht: ${LEVELS[level]} – nicht rechtzeitig gefunden.)`;
      S.statusMsg = msg;
      layout(); render(); autosave();
    }, 40);
  }

  // ---------------------------------------------------------------- Eingabemodus
  async function startEdit({ prefill = null, squiggly = false, regions = null, diagonals = false, colors = false } = {}) {
    if (S.generating) return;
    if (!prefill && !regions && !(await confirmDiscard())) return;
    S.game.startEditing(prefill, regions, squiggly, diagonals, colors);
    S.paused = false; S.noteMode = false; S.selected = 0; S.hintCell = null; S.unsure = new Set();
    S.regionMode = squiggly && !regions && !prefill;
    if (S.regionMode) { S.paintRegion = 0; S.painted = false; regionStatus(); }
    else S.statusMsg = "Vorgaben eintragen, dann „Fertig“.";
    layout(); render();
  }

  async function finishEdit() {
    const g = S.game;
    if (!g.editing) return;
    const [st, n] = g.finishEditing();
    if (st === "regions") {
      await info("Gebiete prüfen", "Die Gebiete sind noch nicht in Ordnung:\n\n• " + n.join("\n• ") +
        "\n\nJedes Gebiet braucht genau 9 zusammenhängende Felder.");
      S.regionMode = true; regionStatus(); layout(); render();
      return;
    }
    const texts = {
      conflict: "Die Eingabe enthält doppelte Zahlen (rot markiert).",
      few: `Erst ${n} Vorgaben – ein eindeutiges Sudoku braucht mindestens 17.`,
      none: "Dieses Rätsel hat keine Lösung.",
      multiple: "Dieses Rätsel hat mehrere Lösungen. Bitte weitere Vorgaben ergänzen.",
    };
    if (st !== "ok") { info("Rätsel prüfen", texts[st]); render(); return; }
    S.selected = null; S.showErrors = false; S.regionMode = false; S.unsure = new Set();
    S.lastTick = performance.now();
    const kind = g.kind() === "Sudoku" ? "Rätsel" : g.kind();
    layout();
    afterChange(`${kind} übernommen: ${n} Vorgaben, Schwierigkeit ${LEVELS[g.level]}.`);
  }

  function cancelEdit() {
    if (!S.game.editing) return;
    S.game.cancelEditing();
    S.selected = null; S.regionMode = false; S.unsure = new Set();
    layout();
    afterChange("Eingabe abgebrochen.");
  }

  function toggleRegionMode() {
    const g = S.game;
    if (!(g.editing && g.editRegions)) { S.regionMode = false; return; }
    S.regionMode = !S.regionMode;
    S.hover = null;
    if (S.regionMode) regionStatus(); else S.statusMsg = "Vorgaben eintragen, dann „Fertig“.";
    layout(); render();
  }
  function toggleDiagonals() {
    const g = S.game;
    if (!g.editing) { status("Diagonalen lassen sich im Eingabemodus ein- und ausschalten."); return; }
    g.setDiagonals(!g.editDiagonals);
    S.statusMsg = g.editDiagonals ? "Diagonalen EIN (X-Sudoku)." : "Diagonalen AUS.";
    render();
  }
  function toggleColors() {
    const g = S.game;
    if (!g.editing) { status("Farbgruppen lassen sich im Eingabemodus ein- und ausschalten."); return; }
    if (!g.setColors(!g.editColors)) { status("Farbsudoku gibt es nur mit 3×3-Blöcken (nicht mit Squiggly-Gebieten)."); return; }
    S.statusMsg = g.editColors ? "Farbgruppen EIN (Farbsudoku)." : "Farbgruppen AUS.";
    render();
  }
  function paintCell(i) { if (S.game.setRegion(i, S.paintRegion)) { S.painted = true; regionStatus(); render(); } }
  function regionStatus() {
    const problems = C.regionProblems(S.game.regionMap());
    S.statusMsg = !S.painted ? "Farbe wählen, dann Felder antippen oder überstreichen."
      : problems.length ? problems[0] : "Alle 9 Gebiete in Ordnung – „Fertig malen“.";
    renderStatus();
  }

  // ---------------------------------------------------------------- Codes
  async function importCode(text) {
    let grid, lay;
    try { [grid, lay] = C.parseCode(text); }
    catch (e) { info("Einfügen", "Kein gültiges Rätsel erkannt.\n" + e.message); return; }
    if (!(await confirmDiscard())) return;
    await startEdit({ prefill: grid, regions: lay.squiggly ? lay.regionOf : null, diagonals: lay.diagonals, colors: lay.colors });
    finishEdit();
  }
  function pasteDialog() {
    dialog(`<h2>Rätsel-Code einfügen</h2>
      <p>81 Zeichen (Ziffern, <b>.</b> oder <b>0</b> für leer), bei Squiggly <b>|</b> + 81 Gebietsziffern, bei Diagonalen am Ende <b>|X</b>.</p>
      <textarea id="codeIn" placeholder="z. B. 1.3....9.........5...582..3 …"></textarea>`,
      [{ label: "Aus Zwischenablage", value: "clip" }, { label: "Abbrechen", value: null }, { label: "Übernehmen", primary: true, value: "ok" }],
      { onOpen: (d) => { d.querySelector("#codeIn").focus(); d._text = () => d.querySelector("#codeIn").value; } })
      .then(async (v) => { /* Wert wird in onclick unten gelesen */ });
    // Schaltflächen nach dem Öffnen umleiten, damit wir den Text lesen können
    const d = overlay.querySelector(".dlg");
    const [bClip, , bOk] = d.querySelectorAll(".btns button");
    bClip.onclick = async () => {
      try { d.querySelector("#codeIn").value = await navigator.clipboard.readText(); }
      catch (e) { status("Zugriff auf die Zwischenablage nicht möglich – bitte manuell einfügen."); }
    };
    bOk.onclick = () => { const t = d.querySelector("#codeIn").value; close(); importCode(t); };
  }
  async function copyCode() {
    const g = S.game;
    const grid = g.editing ? g.values : g.puzzle();
    const lay = g.editing ? (g.activeLayout() || C.CLASSIC) : g.layout;
    const code = C.toCode(grid, lay);
    try { await navigator.clipboard.writeText(code); status("Rätsel-Code in die Zwischenablage kopiert."); }
    catch (e) {
      dialog(`<h2>Rätsel-Code</h2><textarea readonly id="codeOut">${esc(code)}</textarea>`, [{ label: "Schließen", primary: true }],
        { onOpen: (d) => { const t = d.querySelector("#codeOut"); t.focus(); t.select(); } });
    }
  }

  // ---------------------------------------------------------------- Analyse
  function analyze() {
    const g = S.game;
    const grid = g.editing ? g.values.slice() : g.puzzle();
    const lay = g.activeLayout();
    const n = grid.filter(v => v).length;
    if (!lay) { info("Analyse", "Die Gebiete sind noch nicht vollständig (je 9 Felder)."); return; }
    if (g.editing && g.conflicts().size) { info("Analyse", "Die Eingabe enthält doppelte Zahlen."); return; }
    const sols = C.countSolutions(grid, 2, lay);
    if (sols !== 1) { info("Analyse", sols === 0 ? "Das Rätsel hat keine Lösung." : "Das Rätsel hat (noch) mehrere Lösungen."); return; }
    const [level, used] = C.rateDetails(grid, C.MAX_LEVEL, lay);
    const kind = { Sudoku: "Klassisches Sudoku", Squiggly: "Squiggly-Sudoku" }[lay.kind] || lay.kind;
    const lines = [kind, `Schwierigkeit: ${LEVELS[level]}`, `Vorgaben: ${n}`, ""];
    if (Object.keys(used).length) {
      lines.push("Benötigte Techniken (Anzahl Anwendungen):");
      for (const [name, lvl] of C.TECHNIQUES) if (used[name]) lines.push(`   • ${name}: ${used[name]}×   (${LEVELS[lvl]})`);
    }
    if (level === 5) lines.push("", "Mit den eingebauten Techniken nicht vollständig lösbar –", "erfordert Erzwingungsketten oder Ausprobieren.");
    lines.push("", "Stufen:", "   Leicht – nur Einzelne", "   Mittel – Block-Linien-Interaktion, Paare,",
      "                 bei Squiggly: Gesetz der Überbleibsel", "   Schwer – Tripel, X-Wing, Swordfish, XY-/XYZ-Wing",
      "   Sehr schwer – Quadrupel, Jellyfish, W-Wing, Färbung, X-/XY-Ketten", "   Extrem – darüber hinaus");
    info("Schwierigkeit analysieren", lines.join("\n"));
  }

  // ---------------------------------------------------------------- Drucken
  async function printPuzzle() {
    const g = S.game;
    let include = false;
    if (g.hasProgress() && !g.editing) {
      const v = await dialog("<h2>Drucken</h2><p>Eigene Eingaben mitdrucken?</p>",
        [{ label: "Nur Rätsel", value: false }, { label: "Mit Eingaben", primary: true, value: true }]);
      if (v === null) return;
      include = v;
    }
    const reg = g.regionMap();
    const groups = g.colors && !g.squiggly;
    const colored = g.squiggly && settings.colored;
    const diag = g.diagonals ? C.DIAG_CELLS : new Set();
    const lines = diag.size && (settings.diagStyle === "lines" || groups);
    let rows = "";
    for (let r = 0; r < 9; r++) {
      rows += "<tr>";
      for (let c = 0; c < 9; c++) {
        const i = r * 9 + c, v = g.values[i], cls = [];
        if (c < 8 && reg[i] !== reg[i + 1]) cls.push("br");
        if (r < 8 && reg[i] !== reg[i + 9]) cls.push("bb");
        let bg = groups ? GROUP_COLORS[C.COLOR_OF[i]] : colored ? REGION_COLORS[reg[i]] : "";
        if (diag.has(i) && !lines) bg = colored ? darker(bg) : "#e4e4e4";
        let txt = "";
        if (v && (g.givens[i] || g.editing)) txt = v;
        else if (v && include) { txt = v; cls.push("user"); }
        rows += `<td class="${cls.join(" ")}"${bg ? ` style="background:${bg}"` : ""}>${txt}</td>`;
      }
      rows += "</tr>";
    }
    const svg = lines ? '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100" stroke="#8fa6c8" stroke-width="0.6"/><line x1="100" y1="0" x2="0" y2="100" stroke="#8fa6c8" stroke-width="0.6"/></svg>' : "";
    $("print").innerHTML = `<h1>${esc(g.kind())}</h1><p>${esc(statusPrefix())} · ${new Date().toLocaleDateString("de-AT")}</p>
      <div class="wrap"><table>${rows}</table>${svg}</div>`;
    window.print();
  }

  // ---------------------------------------------------------------- Lösungstechniken
  const TECH = window.SUDOKU_TECH || { techniques: [], basics: [], approach: [], levels: {} };
  const LEVEL_COLORS = { 1: "#2e7d32", 2: "#1f78b4", 3: "#e08a00", 4: "#c0392b", 5: "#6a1b9a" };

  function findTech(name) {
    return TECH.techniques.find(t => t.name === name || (name.includes("Quadrupel") && t.name.includes("Quadrupel")));
  }
  // Technik zum Tipp: die schwierigste vorher angewandte, sonst der Einzelne selbst (wie im PC-Programm)
  function techForHint(h) {
    const lvl = Object.fromEntries(C.TECHNIQUES.map(([n, l]) => [n, l]));
    const used = [...new Set(h.techniques || [])];
    if (used.length) {
      let best = used[0];
      for (const n of used) if ((lvl[n] || 0) >= (lvl[best] || 0)) best = n;
      return best;
    }
    return h.single || null;
  }
  // Text mit <b>, <i>, <font color> aus der Technik-Datei (eigene Inhalte) -> HTML
  const rich = (t) => t.replace(/<font color=['"]?(#[0-9a-fA-F]{6})['"]?>/g, '<span style="color:$1">').replace(/<\/font>/g, "</span>");

  function svgBoard(spec) {
    const cs = 36, lab = 16, rows = spec.rows, cols = spec.cols;
    const reg = spec.regions || C.CLASSIC_REGIONS;
    const W = cs * cols.length, H = cs * rows.length;
    const cellOf = (ref) => { const [z, sp] = ref.slice(1).split("S"); return [+z - 1, +sp - 1]; };
    const X = (c) => lab + (c - cols[0]) * cs, Y = (r) => lab + (r - rows[0]) * cs;
    const shade = new Set(spec.shade);
    let o = `<svg class="board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W + lab + 3} ${H + lab + 3}" width="${Math.round((W + lab + 3) * 1.25)}">`;
    for (const r of rows) for (const c of cols) {
      const ref = `Z${r + 1}S${c + 1}`;
      const fill = spec.fills[ref] || (shade.has(ref) ? "#eef1f5" : "#fff");
      o += `<rect x="${X(c)}" y="${Y(r)}" width="${cs}" height="${cs}" fill="${fill}"/>`;
    }
    for (const r of rows) o += `<text x="${lab / 2}" y="${Y(r) + cs / 2 + 3.5}" font-size="10" fill="#888" text-anchor="middle">${r + 1}</text>`;
    for (const c of cols) o += `<text x="${X(c) + cs / 2}" y="${lab - 5}" font-size="10" fill="#888" text-anchor="middle">${c + 1}</text>`;
    for (let k = 1; k < cols.length; k++) o += `<line x1="${lab + k * cs}" y1="${lab}" x2="${lab + k * cs}" y2="${lab + H}" stroke="#b8b8b8" stroke-width="1"/>`;
    for (let k = 1; k < rows.length; k++) o += `<line x1="${lab}" y1="${lab + k * cs}" x2="${lab + W}" y2="${lab + k * cs}" stroke="#b8b8b8" stroke-width="1"/>`;
    for (const r of rows) for (const c of cols) {
      const i = r * 9 + c;
      if (c !== cols[cols.length - 1] && reg[i] !== reg[i + 1]) o += `<line x1="${X(c) + cs}" y1="${Y(r)}" x2="${X(c) + cs}" y2="${Y(r) + cs}" stroke="#222" stroke-width="2.2"/>`;
      if (r !== rows[rows.length - 1] && reg[i] !== reg[i + 9]) o += `<line x1="${X(c)}" y1="${Y(r) + cs}" x2="${X(c) + cs}" y2="${Y(r) + cs}" stroke="#222" stroke-width="2.2"/>`;
    }
    o += `<rect x="${lab}" y="${lab}" width="${W}" height="${H}" fill="none" stroke="#222" stroke-width="2.2"/>`;
    for (const [a, b, t] of spec.links) {
      const [ra, ca] = cellOf(a), [rb, cb] = cellOf(b);
      o += `<line x1="${X(ca) + cs / 2}" y1="${Y(ra) + cs / 2}" x2="${X(cb) + cs / 2}" y2="${Y(rb) + cs / 2}" stroke="#d35400" stroke-width="2"${t === "w" ? ' stroke-dasharray="5 4"' : ""}/>`;
    }
    for (const [ref, v] of Object.entries(spec.givens)) {
      const [r, c] = cellOf(ref);
      o += `<text x="${X(c) + cs / 2}" y="${Y(r) + cs * .72}" font-size="${cs * .6}" fill="#333" text-anchor="middle">${v}</text>`;
    }
    const fs = cs * .32;
    for (const [ref, ds] of Object.entries(spec.cands)) {
      const [r, c] = cellOf(ref), marks = spec.mark[ref] || {};
      for (const d of ds) {
        const sr = Math.floor((+d - 1) / 3), sc = (+d - 1) % 3;
        const cx = X(c) + cs * (.19 + .31 * sc), cy = Y(r) + cs * (.19 + .31 * sr), m = marks[d];
        if (m === "g" || m === "b") {
          o += `<circle cx="${cx}" cy="${cy}" r="${fs * .62}" fill="${m === "g" ? "#2e7d32" : "#1f5fa8"}"/>`;
          o += `<text x="${cx}" y="${cy + fs * .36}" font-size="${fs}" font-weight="bold" fill="#fff" text-anchor="middle">${d}</text>`;
        } else if (m === "x") {
          o += `<text x="${cx}" y="${cy + fs * .36}" font-size="${fs}" font-weight="bold" fill="#c62828" text-anchor="middle">${d}</text>`;
          o += `<line x1="${cx - fs * .55}" y1="${cy + fs * .55}" x2="${cx + fs * .55}" y2="${cy - fs * .55}" stroke="#c62828" stroke-width="1.4"/>`;
        } else {
          o += `<text x="${cx}" y="${cy + fs * .36}" font-size="${fs}" fill="#444" text-anchor="middle">${d}</text>`;
        }
      }
    }
    return o + "</svg>";
  }

  // ---------------------------------------------------------------- Maus & Finger
  function hitCell(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top, s = S.cell;
    if (x < 0 || y < 0 || x >= 9 * s || y >= 9 * s) return null;
    const c = Math.min(8, Math.floor(x / s)), r = Math.min(8, Math.floor(y / s));
    const sx = Math.min(2, Math.floor((x - c * s) / (s / 3))), sy = Math.min(2, Math.floor((y - r * s) / (s / 3)));
    return [r * 9 + c, sy * 3 + sx + 1];
  }
  const hoverOk = (i) => {
    const g = S.game;
    return !(S.paused || S.generating || g.finished || g.givens[i] || S.regionMode);
  };

  canvas.addEventListener("pointerdown", (e) => {
    setInputFrom(e.pointerType);
    const h = hitCell(e);
    if (!h || S.generating) return;
    const [i, d] = h, g = S.game;
    if (S.paused) { togglePause(); return; }
    if (S.regionMode) {
      if (e.button === 2) { S.paintRegion = g.regionMap()[i]; regionStatus(); render(); return; }
      S.painting = true; canvas.setPointerCapture(e.pointerId); paintCell(i); return;
    }
    if (S.input === "touch") { S.selected = i; S.hintCell = null; render(); return; }
    // Maus
    if (e.button === 2) {
      S.selected = i;
      if (!g.editing && !g.values[i]) inputDigit(d, true); else render();
      return;
    }
    if (e.button !== 0) return;
    S.selected = i; S.clickNote = null;
    if (hoverOk(i) && !g.values[i] && !g.editing) {
      if (g.toggleNote(i, d)) { S.clickNote = [i, d, g._undo.length]; afterChange(); return; }
    }
    render();
  });
  canvas.addEventListener("dblclick", (e) => {
    if (S.input !== "mouse" || S.regionMode || S.paused || S.generating) return;
    const h = hitCell(e);
    if (!h) return;
    const [i, d] = h, g = S.game;
    S.selected = i;
    const cn = S.clickNote;
    if (cn && cn[0] === i && cn[1] === d && g._undo.length === cn[2]) g.undo();   // Notiz vom ersten Klick zurücknehmen
    S.clickNote = null;
    if (g.values[i] && !g.givens[i] && !g.editing) erase();
    else inputDigit(d, false);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse") setInputFrom("mouse");
    if (S.regionMode) {
      if (S.painting) { const h = hitCell(e); if (h) paintCell(h[0]); }
      return;
    }
    if (S.input !== "mouse") return;
    const h = hitCell(e);
    let nh = null;
    if (h && hoverOk(h[0])) nh = [h[0], S.game.values[h[0]] ? null : h[1]];
    if (JSON.stringify(nh) !== JSON.stringify(S.hover)) { S.hover = nh; drawBoard(); }
  });
  canvas.addEventListener("pointerup", () => { S.painting = false; });
  canvas.addEventListener("pointercancel", () => { S.painting = false; });
  canvas.addEventListener("pointerleave", () => { if (S.hover) { S.hover = null; drawBoard(); } });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  document.addEventListener("keydown", (e) => {
    if (overlay.classList.contains("on") || S.generating) return;
    const k = e.key;
    if ((e.ctrlKey || e.metaKey) && (k === "z" || k === "Z")) { e.preventDefault(); undo(); return; }
    if ((e.ctrlKey || e.metaKey) && (k === "y" || k === "Y")) { e.preventDefault(); redo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (k === "p" || k === "P") { togglePause(); return; }
    if (S.paused) return;
    if (k === "g" || k === "G") { toggleRegionMode(); return; }
    if (k === "x" || k === "X") { toggleDiagonals(); return; }
    if (k === "f" || k === "F") { toggleColors(); return; }
    if (S.regionMode) { if (k >= "1" && k <= "9") { S.paintRegion = +k - 1; regionStatus(); render(); } return; }
    if (k >= "1" && k <= "9") inputDigit(+k, S.noteMode);
    else if (k === "0" || k === "Delete" || k === "Backspace") erase();
    else if (k === "n" || k === "N" || k === " ") { e.preventDefault(); toggleNoteMode(); }
    else if (k.startsWith("Arrow")) {
      e.preventDefault();
      const i = S.selected === null ? 40 : S.selected;
      const r = Math.floor(i / 9), c = i % 9;
      const [dr, dc] = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k];
      S.selected = ((r + dr + 9) % 9) * 9 + (c + dc + 9) % 9;
      render();
    }
  });
  document.addEventListener("paste", (e) => {
    if (overlay.classList.contains("on")) return;          // im Dialog normal einfügen
    const text = (e.clipboardData || window.clipboardData).getData("text");
    if (text) { e.preventDefault(); importCode(text); }
  });

  // Werkzeugleiste & Kopf
  $("btnMenu").onclick = menu;
  $("btnPrint").onclick = printPuzzle;
  $("btnHat").onclick = hatMenu;
  $("btnUndo").onclick = undo;
  $("btnUndo").oncontextmenu = (e) => { e.preventDefault(); redo(); };
  $("btnRestart").onclick = restart;
  $("btnPause").onclick = () => (S.game.editing ? finishEdit() : togglePause());
  $("btnWarn").onclick = toggleErrors;
  $("btnCheck").onclick = check;
  $("btnRegions").onclick = toggleRegionMode;
  $("btnDiag").onclick = toggleDiagonals;
  $("btnColors").onclick = toggleColors;
  $("status").onclick = () => { if (S.hintTech && S.statusMsg.startsWith("Tipp:")) techDialog(S.hintTech); };
  $("btnCancelEdit").onclick = cancelEdit;

  // ---------------------------------------------------------------- Speichern
  function stateForSave() { const g = S.game; return g.editing ? g._editBackup : g.toDict(); }
  function autosave() { const d = stateForSave(); if (d) store.set(KEY_SAVE, d); }
  document.addEventListener("visibilitychange", () => { if (document.hidden) autosave(); });
  window.addEventListener("pagehide", autosave);
  setInterval(autosave, 15000);

  window.addEventListener("resize", () => { layout(); render(); });

  // ---------------------------------------------------------------- Start
  function start() {
    layout();
    const saved = store.get(KEY_SAVE);
    if (saved) {
      try {
        const g = new C.Game(); g.fromDict(saved);
        S.game = g; S.statusMsg = "Letztes Spiel fortgesetzt.";
        layout(); render(); return;
      } catch (e) { /* defekt -> neues Spiel */ }
    }
    newGame(2, false, false, false, false);
  }
  // Für Tests von außen erreichbar
  window.SudokuUI = { S, render, layout, newGame, startEdit, finishEdit, importCode, analyze, hint, settings, techDialog };
  start();
})();

</script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>

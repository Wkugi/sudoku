<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<meta name="theme-color" content="#1e1e1e">
<title>Sudoku</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bar: #1e1e1e; --bar-fg: #fff; --accent: #ffb300; --status: #555; --nb-bg: #f1f1f1; --nb-fg: #333;
  --nb-done: #c4c4c4; --nb-sel: #cfdcf0; --nb-note: #ffe9b3; --user: #1f5fa8;
  --font: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #fff; font-family: var(--font); color: #222; }
body { overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#app { display: flex; flex-direction: column; align-items: center; justify-content: safe center; height: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#top { width: var(--w); display: flex; align-items: center; justify-content: space-between; height: 44px; flex: none; }
#top h1 { font-size: 17px; font-weight: 600; margin: 0; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top h1 span { font-weight: 400; color: var(--status); }
.iconbtn { background: none; border: none; padding: 8px; cursor: pointer; color: #333; border-radius: 8px; }
.iconbtn:hover { background: #f0f0f0; }
#board { display: block; flex: none; touch-action: none; cursor: default; }
#status { width: var(--w); min-height: 22px; font-size: 13px; color: var(--status); padding: 4px 2px; flex: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#editbar { width: var(--w); display: none; gap: 6px; padding: 2px 0 6px; flex: none; }
#editbar.on { display: flex; }
#editbar button { flex: 1; font: 13px var(--font); padding: 7px 4px; border-radius: 8px; border: 1px solid #ccc; background: #fafafa; cursor: pointer; color: #333; }
#editbar button.active { background: var(--bar); color: var(--accent); border-color: var(--bar); }
.bar { width: var(--w); display: grid; gap: 4px; flex: none; }
.bar button { border: none; border-radius: 6px; background: var(--nb-bg); color: var(--nb-fg); cursor: pointer;
  font-family: var(--font); position: relative; padding: 0; touch-action: manipulation; }
.bar button:active { filter: brightness(.92); }
.bar button .cnt { position: absolute; bottom: 2px; right: 4px; font-size: 9px; color: #9a9a9a; }
.bar button.done { color: var(--nb-done); }
.bar button.sel { background: var(--nb-sel); }
.bar button.note-on { background: var(--nb-note); }
.bar button.mode-on { background: var(--bar); color: var(--accent); }
.bar button small { display: block; font-size: 10px; margin-top: 1px; }
#barMouse { grid-template-columns: repeat(11, 1fr); height: var(--nbh); margin-bottom: 6px; }
#barMouse button { font-size: calc(var(--nbh) * .5); }
#barNotes { grid-template-columns: repeat(10, 1fr); height: calc(var(--nbh) * .62); margin-bottom: 4px; }
#barNotes button { font-size: calc(var(--nbh) * .3); background: #fbf6e6; color: #6b5a2a; }
#barNotes button.note-on { background: var(--nb-note); color: #333; font-weight: 600; }
#barValues { grid-template-columns: repeat(10, 1fr); height: var(--nbh); margin-bottom: 6px; }
#barValues button { font-size: calc(var(--nbh) * .52); }
.rowlabel { font-size: 10px !important; color: var(--status) !important; background: none !important; cursor: default !important; }
#tools { width: var(--w); background: var(--bar); color: var(--bar-fg); border-radius: 0; flex: none;
  display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr 1fr; height: calc(var(--nbh) * 1.9); }
#tools button { background: none; border: none; color: var(--bar-fg); cursor: pointer; display: flex; align-items: center;
  justify-content: center; font: calc(var(--nbh) * .3) var(--font); }
#tools button:disabled { opacity: .35; cursor: default; }
#tools button.active { color: var(--accent); }
#tools svg { width: calc(var(--nbh) * .52); height: calc(var(--nbh) * .52); }
#timer { grid-column: 2 / 5; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; font-size: calc(var(--nbh) * .32); }
#btnPause { grid-column: 3 / 4; }
#tools .gap { pointer-events: none; }
/* Dialoge */
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 10; padding: 12px; }
#overlay.on { display: flex; }
.dlg { background: #fff; border-radius: 14px; max-width: 460px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px 18px 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); -webkit-user-select: text; user-select: text; }
.dlg h2 { margin: 0 0 10px; font-size: 18px; }
.dlg p, .dlg li { font-size: 14px; line-height: 1.45; }
.dlg pre { white-space: pre-wrap; font: 13px/1.45 var(--font); margin: 0; }
.dlg textarea { width: 100%; height: 90px; font: 13px ui-monospace, Menlo, Consolas, monospace; padding: 8px; border-radius: 8px; border: 1px solid #ccc; }
.dlg .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.dlg button, .menu button { font: 15px var(--font); padding: 9px 14px; border-radius: 9px; border: 1px solid #ccc; background: #f7f7f7; cursor: pointer; color: #222; }
.dlg button.primary { background: var(--bar); color: #fff; border-color: var(--bar); }
.menu h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #888; margin: 14px 0 6px; }
.menu h3:first-child { margin-top: 0; }
.menu .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.menu .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.menu .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 6px; }
.menu .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
/* Lösungstechniken */
.dlg.wide { max-width: 720px; }
.tech .list button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 7px 10px;
  border-radius: 8px; font-size: 15px; }
.tech .list button:hover { background: #f2f4f7; }
.tech .list h3 { margin: 12px 0 2px; font-size: 13px; text-transform: none; letter-spacing: 0; }
.tech .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.tech .head button { padding: 6px 10px; font-size: 14px; }
.tech h2 { color: #1f3a5f; margin: 4px 0 2px; }
.tech .lvl { font-size: 13px; font-weight: 600; }
.tech .eng { font-size: 12px; color: #888; margin-left: 10px; font-weight: 400; }
.tech h4 { color: #1f3a5f; margin: 14px 0 4px; font-size: 14px; }
.tech p, .tech li { font-size: 14px; line-height: 1.5; margin: 4px 0; }
.tech ol, .tech ul { padding-left: 22px; margin: 4px 0; }
.tech svg.board { display: block; max-width: 100%; height: auto; margin: 8px 0; }
.tech .nav { display: flex; justify-content: space-between; margin-top: 14px; gap: 8px; }
#status.link { cursor: pointer; color: #1f5fa8; }
.menu .tabs button { font-size: 13px; padding: 7px 2px; }
.menu .tabs button.on { background: var(--bar); color: var(--accent); border-color: var(--bar); }
.menu .grid button { font-size: 13px; padding: 9px 2px; }
.menu label { display: flex; align-items: center; gap: 8px; font-size: 15px; padding: 6px 0; }
.menu .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.menu .seg button { font-size: 13px; padding: 7px 2px; }
.menu .seg button.on { background: var(--bar); color: var(--accent); border-color: var(--bar); }
#print { display: none; }
@media print {
  #app, #overlay { display: none !important; }
  #print { display: block; }
  #print h1 { font-weight: 400; font-size: 20pt; margin: 0 0 4mm; } #print p { color: #777; margin: 0 0 8mm; }
  #print table { border-collapse: collapse; border: 3px solid #222; }
  #print td { width: 15mm; height: 15mm; border: 1px solid #aaa; text-align: center; font-size: 24pt; padding: 0; }
  #print td.br { border-right: 3px solid #222; } #print td.bb { border-bottom: 3px solid #222; }
  #print td.user { color: #1f5fa8; }
  #print .wrap { position: relative; display: inline-block; }
  #print .wrap svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1 id="title">Sudoku</h1>
    <button class="iconbtn" id="btnMenu" aria-label="Menü">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="#333" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <canvas id="board"></canvas>
  <div id="status"></div>
  <div id="editbar">
    <button id="btnRegions">Gebiete malen</button>
    <button id="btnDiag">Diagonalen</button>
    <button id="btnColors">Farben</button>
    <button id="btnCancelEdit">Abbrechen</button>
  </div>
  <div id="barMouse" class="bar"></div>
  <div id="barNotes" class="bar"></div>
  <div id="barValues" class="bar"></div>
  <div id="tools">
    <button id="btnPrint" title="Drucken"></button>
    <div id="timer">00:00:00</div>
    <button id="btnHat" title="Hilfen"></button>
    <button id="btnUndo" title="Rückgängig (Strg+Z)"></button>
    <button id="btnRestart" title="Neustart"></button>
    <button id="btnPause" title="Pause / Weiter">Pause</button>
    <button id="btnWarn" title="Fehler anzeigen"></button>
    <button id="btnCheck" title="Lösung prüfen"></button>
  </div>
</div>
<div id="overlay"></div>
<div id="print"></div>
<script>
window.SUDOKU_TECH = {"levels":{"1":"Leicht","2":"Mittel","3":"Schwer","4":"Sehr schwer","5":"Extrem"},"basics":["<b>Zeile<\/b> (waagrecht), <b>Spalte<\/b> (senkrecht), <b>Block<\/b> (3×3-Kasten). Im Bild hinterlegt: Zeile 2, Spalte 7 und Block 7.","<b>Einheit<\/b>: Oberbegriff für Zeile, Spalte oder Block. Jede Einheit enthält jede Ziffer 1–9 genau einmal.","<b>Feldangabe<\/b>: Z5S5 = Zeile 5, Spalte 5 (gelb). Blöcke sind von links oben nach rechts unten von 1 bis 9 nummeriert.","<b>Kandidat<\/b>: eine Ziffer, die in einem leeren Feld nach den bisherigen Einträgen noch möglich ist. Kandidaten werden als kleine Notizen eingetragen (im Programm: Zauberhut → „Kandidaten automatisch eintragen“).","<b>Sich sehen<\/b>: Zwei Felder „sehen sich“, wenn sie in derselben Einheit liegen. Felder, die sich sehen, können nicht dieselbe Ziffer haben.","<b>Starke Verbindung<\/b> (für eine Ziffer d): In einer Einheit gibt es genau zwei Plätze für d. Ist der eine Platz <i>nicht<\/i> d, <i>muss<\/i> der andere d sein. In den Bildern: durchgezogene Linie.","<b>Schwache Verbindung<\/b>: Zwei Felder sehen sich und haben beide d als Kandidaten. Ist der eine d, kann der andere <i>nicht<\/i> d sein. In den Bildern: gestrichelte Linie.","<b>Squiggly-Sudoku<\/b>: Statt der 3×3-Blöcke gibt es neun unregelmäßige <b>Gebiete<\/b> aus je 9 Feldern (dicke Linien). Alle Techniken dieses Dokuments gelten dort genauso – überall, wo „Block“ steht, ist dann das Gebiet gemeint. Dazu kommt das „Gesetz der Überbleibsel“ (Stufe Mittel).","<b>X-Sudoku<\/b> (auch als Squiggly-X): Zusätzlich müssen beide Hauptdiagonalen 1–9 genau einmal enthalten. Die Diagonalen sind einfach zwei weitere Einheiten – alle Techniken gelten mit ihnen. Das Mittelfeld Z5S5 liegt auf beiden Diagonalen und sieht dadurch besonders viele Felder.","<b>Farbsudoku<\/b> (auch als Farbsudoku-X): Die Felder an derselben Stelle ihres Blocks haben dieselbe Farbe – z. B. sind alle Felder links oben in den Blöcken rot. Jede der neun <b>Farbgruppen<\/b> muss 1–9 genau einmal enthalten. Auch die Farbgruppen sind einfach weitere Einheiten, für die alle Techniken gelten.","<b>Ausschluss (Elimination)<\/b>: Fast alle fortgeschrittenen Techniken setzen keine Ziffer direkt, sondern streichen Kandidaten. Danach entstehen meist neue Einzelne."],"basics_board":{"rows":[0,1,2,3,4,5,6,7,8],"cols":[0,1,2,3,4,5,6,7,8],"givens":{"Z5S5":7},"cands":{},"fills":{"Z5S5":"#fff3c4"},"shade":["Z2S1","Z2S2","Z2S3","Z2S4","Z2S5","Z2S6","Z2S7","Z2S8","Z2S9","Z1S7","Z2S7","Z3S7","Z4S7","Z5S7","Z6S7","Z7S7","Z8S7","Z9S7","Z7S1","Z7S2","Z7S3","Z8S1","Z8S2","Z8S3","Z9S1","Z9S2","Z9S3"],"mark":{},"links":[]},"approach":["Zuerst nur mit Einzelnen arbeiten, solange es geht – ohne Notizen, das geht schnell.","Wenn nichts mehr geht: Kandidaten vollständig eintragen und nach jeder gesetzten Ziffer aktuell halten (das Programm streicht Notizen in Zeile, Spalte und Block automatisch).","Techniken immer in der Reihenfolge dieses Dokuments suchen: erst die einfachen. Nach jedem Ausschluss wieder nach Einzelnen schauen.","Erst wenn alle Techniken einer Stufe nichts mehr bringen, zur nächsten Stufe gehen."],"techniques":[{"name":"Nackter Einzelner","english":"Naked Single","level":1,"idea":"In einem Feld ist nur noch eine einzige Ziffer möglich, weil alle anderen acht Ziffern bereits in seiner Zeile, Spalte oder seinem Block stehen.","how":["Ein leeres Feld wählen.","Alle Ziffern sammeln, die in seiner Zeile, Spalte und seinem Block schon stehen.","Fehlt genau eine Ziffer, gehört sie in dieses Feld."],"example":["Für Z5S5: Zeile 5 enthält 1, 2, 3 – Spalte 5 enthält 4, 5, 6 – Block 5 enthält 7 und 9.","Es fehlt nur die <b>8<\/b>, also ist Z5S5 = 8."],"tip":"Bei eingetragenen Kandidaten erkennst du nackte Einzelne sofort: Felder mit nur einer Notiz.","board":{"rows":[0,1,2,3,4,5,6,7,8],"cols":[0,1,2,3,4,5,6,7,8],"givens":{"Z5S1":1,"Z5S2":2,"Z5S9":3,"Z1S5":4,"Z2S5":5,"Z9S5":6,"Z4S4":7,"Z6S6":9},"cands":{"Z5S5":"8"},"fills":{"Z5S5":"#cdeccf"},"shade":["Z5S1","Z5S2","Z5S3","Z5S4","Z5S5","Z5S6","Z5S7","Z5S8","Z5S9","Z1S5","Z2S5","Z3S5","Z4S5","Z5S5","Z6S5","Z7S5","Z8S5","Z9S5","Z4S4","Z4S5","Z4S6","Z5S4","Z5S5","Z5S6","Z6S4","Z6S5","Z6S6"],"mark":{"Z5S5":{"8":"g"}},"links":[]}},{"name":"Versteckter Einzelner","english":"Hidden Single","level":1,"idea":"Eine Ziffer hat in einer Einheit nur noch einen möglichen Platz – auch wenn in diesem Feld sonst noch andere Kandidaten stehen.","how":["Eine Einheit (meist einen Block) und eine Ziffer wählen, die dort noch fehlt.","Für jedes leere Feld der Einheit prüfen, ob die Ziffer in seiner Zeile oder Spalte bereits vorkommt („Strahlen“ der vorhandenen Ziffern verfolgen).","Bleibt nur ein Feld übrig, gehört die Ziffer dorthin."],"example":["Wo kann die <b>7<\/b> in Block 1 stehen? Die 7 in Z2S5 und Z3S8 sperrt die Zeilen 2 und 3, die 7 in Z5S2 und Z8S3 sperrt die Spalten 2 und 3.","Rot: gesperrte oder belegte Felder. Übrig bleibt nur <b>Z1S1 = 7<\/b>."],"tip":"Gehe die Ziffern 1–9 der Reihe nach durch und prüfe jeden Block – das ist die schnellste Methode für den Anfang.","board":{"rows":[0,1,2,3,4,5,6,7,8],"cols":[0,1,2,3,4,5,6,7,8],"givens":{"Z2S5":7,"Z3S8":7,"Z5S2":7,"Z8S3":7,"Z2S2":3,"Z1S3":5},"cands":{"Z1S1":"7"},"fills":{"Z1S1":"#cdeccf","Z1S2":"#fde3e1","Z2S1":"#fde3e1","Z2S3":"#fde3e1","Z3S1":"#fde3e1","Z3S2":"#fde3e1","Z3S3":"#fde3e1"},"shade":["Z2S4","Z2S5","Z2S6","Z2S7","Z2S8","Z2S9","Z3S4","Z3S5","Z3S6","Z3S7","Z3S8","Z3S9","Z4S2","Z5S2","Z6S2","Z7S2","Z8S2","Z9S2","Z4S3","Z5S3","Z6S3","Z7S3","Z8S3","Z9S3"],"mark":{"Z1S1":{"7":"g"}},"links":[]}},{"name":"Block-Linien-Interaktion","english":"Locked Candidates (Pointing / Claiming)","level":2,"idea":"Liegen alle Kandidaten einer Ziffer innerhalb eines Blocks in derselben Zeile (oder Spalte), muss die Ziffer in diesem Block genau dort stehen – also nicht im Rest dieser Zeile. Umgekehrt: Liegen alle Kandidaten einer Ziffer in einer Zeile innerhalb eines Blocks, kann die Ziffer im übrigen Block nicht stehen.","how":["Block wählen und für eine Ziffer alle Kandidaten darin ansehen.","Liegen sie alle in einer Zeile/Spalte („Pointing“): Ziffer in dieser Zeile/Spalte außerhalb des Blocks streichen.","Umgekehrt für eine Zeile/Spalte: Liegen alle Kandidaten in einem Block („Claiming“): Ziffer im restlichen Block streichen."],"example":["In Block 1 kann die <b>4<\/b> nur in Z2S1 oder Z2S3 stehen – beide in Zeile 2.","Damit steht die 4 von Zeile 2 sicher in Block 1: In Z2S5, Z2S8 und Z2S9 wird die 4 gestrichen."],"tip":"Bei Squiggly besonders ergiebig: Gebiete reichen über mehrere Zeilen und Spalten und überschneiden sich deshalb mit vielen von ihnen. Beim X-Sudoku gilt die Technik auch zwischen einer Diagonale und einem Block, einer Zeile oder Spalte: Liegen z. B. alle Kandidaten einer Ziffer im Block 1 auf der Diagonale, wird sie im Rest der Diagonale gestrichen. Beim Farbsudoku entsprechend zwischen einer Farbgruppe und einer Zeile oder Spalte.","board":{"rows":[0,1,2,3,4,5,6,7,8],"cols":[0,1,2,3,4,5,6,7,8],"givens":{"Z1S1":1,"Z1S2":2,"Z1S3":3,"Z3S1":5,"Z3S2":7,"Z3S3":8,"Z2S2":9},"cands":{"Z2S1":"46","Z2S3":"46","Z2S5":"45","Z2S8":"14","Z2S9":"48"},"fills":{},"shade":["Z2S1","Z2S2","Z2S3","Z2S4","Z2S5","Z2S6","Z2S7","Z2S8","Z2S9"],"mark":{"Z2S1":{"4":"g"},"Z2S3":{"4":"g"},"Z2S5":{"4":"x"},"Z2S8":{"4":"x"},"Z2S9":{"4":"x"}},"links":[]}},{"name":"Nacktes Paar","english":"Naked Pair","level":2,"idea":"Zwei Felder einer Einheit haben genau dieselben zwei Kandidaten. Diese beiden Ziffern müssen sich auf diese zwei Felder verteilen – in den übrigen Feldern der Einheit sind sie unmöglich.","how":["Felder mit genau zwei Kandidaten suchen.","Gibt es in derselben Einheit ein zweites Feld mit denselben beiden Kandidaten, liegt ein Paar vor.","Beide Ziffern in allen anderen Feldern dieser Einheit streichen."],"example":["In Zeile 1 haben Z1S2 und Z1S6 nur die Kandidaten <b>3 und 7<\/b>.","Eines der beiden Felder ist 3, das andere 7. Daher: 3 und 7 in Z1S4, Z1S8 und Z1S9 streichen."],"tip":"Liegen die beiden Felder zusätzlich im selben Block, gilt der Ausschluss auch für den Block.","board":{"rows":[0,1,2],"cols":[0,1,2,3,4,5,6,7,8],"givens":{"Z1S1":4,"Z1S3":6,"Z1S5":2,"Z1S7":8},"cands":{"Z1S2":"37","Z1S6":"37","Z1S4":"135","Z1S8":"579","Z1S9":"357"},"fills":{},"shade":[],"mark":{"Z1S2":{"3":"g","7":"g"},"Z1S6":{"3":"g","7":"g"},"Z1S4":{"3":"x"},"Z1S8":{"7":"x"},"Z1S9":{"3":"x","7":"x"}},"links":[]}},{"name":"Verstecktes Paar","english":"Hidden Pair","level":2,"idea":"Zwei Ziffern kommen in einer Einheit nur noch in denselben zwei Feldern vor. Dann gehören diese beiden Felder diesen zwei Ziffern – alle anderen Kandidaten in diesen Feldern können gestrichen werden.","how":["Für eine Einheit zählen, in wie vielen Feldern jede fehlende Ziffer möglich ist.","Zwei Ziffern mit je genau zwei Plätzen suchen, die in denselben Feldern liegen.","In diesen beiden Feldern alle übrigen Kandidaten streichen. Es entsteht ein nacktes Paar."],"example":["In Spalte 5 kommen <b>2 und 6<\/b> nur in Z3S5 und Z7S5 vor.","Also sind diese zwei Felder 2 und 6: Die 1 und 9 in Z3S5 sowie die 4 und 9 in Z7S5 werden gestrichen."],"tip":null,"board":{"rows":[0,1,2,3,4,5,6,7,8],"cols":[3,4,5,6],"givens":{"Z2S5":3,"Z4S5":5,"Z6S5":7,"Z8S5":8},"cands":{"Z3S5":"1269","Z7S5":"2469","Z1S5":"19","Z5S5":"49","Z9S5":"14"},"fills":{},"shade":["Z1S5","Z2S5","Z3S5","Z4S5","Z5S5","Z6S5","Z7S5","Z8S5","Z9S5"],"mark":{"Z3S5":{"2":"g","6":"g","1":"x","9":"x"},"Z7S5":{"2":"g","6":"g","4":"x","9":"x"}},"links":[]}},{"name":"Gesetz der Überbleibsel","english":"Law of Leftovers (nur Squiggly)","level":2,"idea":"Drei benachbarte Zeilen enthalten jede Ziffer genau dreimal – drei ganze Gebiete ebenfalls. Legt man die drei Gebiete, die am stärksten in diesen Zeilen liegen, über die Zeilen, bleiben auf beiden Seiten ein paar Felder übrig: Felder der Zeilen, die zu keinem der Gebiete gehören, und Felder der Gebiete außerhalb der Zeilen. Beide Gruppen enthalten <b>genau dieselben Ziffern<\/b>. Das gilt ebenso für 1, 2, 4 … benachbarte Zeilen oder Spalten mit gleich vielen Gebieten.","how":["k benachbarte Zeilen (oder Spalten) wählen, am besten am Rand: die oberste Zeile, die obersten zwei, drei …","Die k Gebiete suchen, die diese Zeilen fast vollständig ausfüllen.","Überbleibsel markieren: Felder der Zeilen, die in keinem dieser Gebiete liegen – und Felder dieser Gebiete außerhalb der Zeilen. Beide Gruppen sind gleich groß.","Beide Gruppen enthalten dieselben Ziffern: Eine Ziffer, die auf der einen Seite nirgends möglich ist, wird auf der anderen gestrichen. Bei je einem Feld sind beide Felder sogar gleich."],"example":["Zeilen 1–3 und die Gebiete 1, 2, 3 (grün, blau, gelb). Gebiet 1 ragt mit <b>Z4S1<\/b> nach unten heraus, dafür gehört <b>Z3S5<\/b> zu Gebiet 5. Diese beiden Felder (orange) sind die Überbleibsel.","Also haben Z3S5 und Z4S1 <b>dieselbe Ziffer<\/b>. Z4S1 kann nur 4 oder 7 sein – deshalb werden 2 und 9 in Z3S5 gestrichen.","Mit nur einem Feld auf jeder Seite ist das die stärkste Form: Sobald eines der beiden Felder gelöst ist, steht auch das andere fest."],"tip":"Am ergiebigsten sind die Ränder des Rasters. Das Programm prüft 1 bis 4 benachbarte Zeilen und Spalten an jeder Stelle.","board":{"rows":[0,1,2,3,4,5],"cols":[0,1,2,3,4,5,6,7,8],"givens":{"Z1S1":5,"Z2S8":1,"Z1S6":3},"cands":{"Z3S5":"2479","Z4S1":"47"},"fills":{"Z1S1":"#dcefd0","Z1S2":"#dcefd0","Z1S3":"#dcefd0","Z1S4":"#d9e8fb","Z1S5":"#d9e8fb","Z1S6":"#d9e8fb","Z1S7":"#fff0bf","Z1S8":"#fff0bf","Z1S9":"#fff0bf","Z2S1":"#dcefd0","Z2S2":"#dcefd0","Z2S3":"#dcefd0","Z2S4":"#d9e8fb","Z2S5":"#d9e8fb","Z2S6":"#d9e8fb","Z2S7":"#fff0bf","Z2S8":"#fff0bf","Z2S9":"#fff0bf","Z3S1":"#dcefd0","Z3S2":"#dcefd0","Z3S3":"#d9e8fb","Z3S4":"#d9e8fb","Z3S6":"#d9e8fb","Z3S7":"#fff0bf","Z3S8":"#fff0bf","Z3S9":"#fff0bf","Z4S1":"#ffd27a","Z3S5":"#ffd27a"},"shade":[],"mark":{"Z3S5":{"4":"g","7":"g","2":"x","9":"x"},"Z4S1":{"4":"g","7":"g"}},"links":[],"regions":[0,0,0,1,1,1,2,2,2,0,0,0,1,1,1,2,2,2,0,0,1,1,4,1,2,2,2,0,3,3,3,4,4,5,5,5, 1":{"2":"g","4":"g","6":"x"},"Z9S5":{"4":"g","8":"g","1":"x","9":"x"},"Z9S7":{"2":"g","8":"g","3":"x"}},"links":[]}},{"name":"X-Wing","english":"X-Wing","level":3,"idea":"Eine Ziffer hat in zwei Zeilen jeweils genau zwei mögliche Plätze, und diese liegen in denselben zwei Spalten (ein Rechteck). Dann steht die Ziffer in diesen beiden Spalten sicher in den beiden Zeilen – egal welche Ecken es sind. In den beiden Spalten kann die Ziffer sonst nirgends stehen.","how":["Eine Ziffer wählen und Zeilen suchen, in denen sie genau zweimal als Kandidat vorkommt.","Zwei solche Zeilen finden, deren Kandidaten in denselben zwei Spalten liegen.","Die Ziffer in diesen zwei Spalten in allen anderen Zeilen streichen.","Dasselbe funktioniert mit vertauschten Rollen (zwei Spalten → Zeilen streichen)."],"example":["Die <b>5<\/b> hat in Zeile 2 und Zeile 7 jeweils nur die Plätze in Spalte 3 und 8.","Entweder Z2S3 + Z7S8 oder Z2S8 + Z7S3 sind 5 – in beiden Fällen sind die Spalten 3 und 8 „versorgt“. Die 5 wird in Z1S3, Z4S3, Z5S8 und Z9S8 gestrichen."],"tip":null,"board":{"rows":[0,1,2,3,4,5,6,7,8],"cols":[0,1,2,3,4,5,6,7,8],"givens":{},"cands":{"Z2S3":"5","Z2S8":"5","Z7S3":"5","Z7S8":"5","Z4S3":"56","Z5S8":"25","Z9S8":"57","Z1S3":"15"},"fills":{},"shade":["Z2S1","Z2S2","Z2S3","Z2S4","Z2S5","Z2S6","Z2S7","Z2S8","Z2S9","Z7S1","Z7S2","Z7S3","Z7S4","Z7S5","Z7S6","Z7S7","Z7S8","Z7S9"],"mark":{"Z2S3":{"5":"g"},"Z2S8":{"5":"g"},"Z7S3":{"5":"g"},"Z7S8":{"5":"g"},"Z4S3":{"5":"x"},"Z5S8":{"5":"x"},"Z9S8":{"5":"x"},"Z1S3":{"5":"x"}},"links":[["Z2S3","Z2S8","s"],["Z7S3","Z7S8","s"],["Z2S3","Z7S3","w"],["Z2S8","Z7S8","w"]]}},{"name":"Swordfish","english":"Swordfish","level":3,"idea":"Die Erweiterung des X-Wings auf drei Zeilen und drei Spalten: Eine Ziffer kommt in drei Zeilen nur in insgesamt drei Spalten vor (je Zeile zwei oder drei Plätze). Dann belegen diese drei Zeilen die Ziffer in den drei Spalten.","how":["Für eine Ziffer Zeilen mit nur zwei oder drei Kandidaten suchen.","Drei solche Zeilen e":[],"mark":{"Z5S5":{"4":"b","7":"b"},"Z5S1":{"9":"g"},"Z2S5":{"9":"g"},"Z2S1":{"9":"x"}},"links":[["Z5S5","Z5S1","w"],["Z5S5","Z2S5","w"]]}},{"name":"XYZ-Wing","english":"XYZ-Wing","level":3,"idea":"Wie der XY-Wing, aber der Drehpunkt hat drei Kandidaten {X,Y,Z}. Dann kann auch der Drehpunkt selbst Z sein. Gestrichen werden darf Z daher nur in Feldern, die alle drei Felder sehen.","how":["Drehpunkt mit drei Kandidaten {X,Y,Z} wählen.","Zwei Flügel {X,Z} und {Y,Z} suchen, die den Drehpunkt sehen.","Z in Feldern streichen, die Drehpunkt und beide Flügel sehen. Das ist meist nur in einem Block möglich."],"example":["Drehpunkt Z2S2 {1,2,6}, Flügel Z2S7 {1,6} (gleiche Zeile) und Z3S1 {2,6} (gleicher Block); Z = <b>6<\/b>.","Eines der drei Felder ist sicher 6. Z2S1 und Z2S3 sehen alle drei (Zeile 2 und Block 1) → 6 dort streichen."],"tip":null,"board":{"rows":[0,1,2,3],"cols":[0,1,2,3,4,5,6,7,8],"givens":{},"cands":{"Z2S2":"126","Z2S7":"16","Z3S1":"26","Z2S1":"68","Z2S3":"36"},"fills":{"Z2S2":"#cfe0f7","Z2S7":"#cdeccf","Z3S1":"#cdeccf"},"shade":[],"mark":{"Z2S2":{"6":"b"},"Z2S7":{"6":"g"},"Z3S1":{"6":"g"},"Z2S1":{"6":"x"},"Z2S3":{"6":"x"}},"links":[["Z2S2","Z2S7","w"],["Z2S2","Z3S1","w"]]}},{"name":"Nacktes und verstecktes Quadrupel","english":"Naked / Hidden Quad","level":4,"idea":"Die Fortsetzung von Paar und Tripel auf vier Felder: <b>Nackt<\/b> – vier Felder einer Einheit enthalten zusammen nur vier Ziffern → diese Ziffern im Rest der Einheit streichen. <b>Versteckt<\/b> – vier Ziffern kommen nur in denselben vier Feldern vor → in diesen Feldern alle anderen Kandidaten streichen.","how":["Vorgehen wie bei Paar und Tripel, nur mit vier Feldern bzw. vier Ziffern.","Hinweis: Ein nacktes Quadrupel ist immer auch ein verstecktes Tripel/Paar „von der anderen Seite“ – oft ist das kleinere Muster leichter zu finden."],"example":["Zeile 4: Z4S1, Z4S3, Z4S6, Z4S8 enthalten zusammen nur <b>1, 2, 5, 8<\/b>.","Gestrichen werden die 1 in Z4S2 und die 2 in Z4S9."],"tip":null,"board":{"rows":[3,4,5],"cols":[0,1,2,3,4,5,6,7,8],"givens":{"Z4S4":4,"Z4S5":7,"Z4S7":3},"cands":{"Z4S1":"12","Z4S3":"25","Z4S6":"158","Z4S8":"28","Z4S2":"169","Z4S9":"269"},"fills":{},"shade":[],"mark":{"Z4S1":{"1":"g","2":"g"},"Z4S3":{"2":"g","5":"g"},"Z4S6":{"1":"g","5":"g","8":"g"},"Z4S8":{"2":"g","8":"g"},"Z4S2":{"1":"x"},"Z4S9":{"2":"x"}},"links":[]}},{"name":"Jellyfish","english":"Jellyfish","level":4,"idea":"X-Wing mit vier Zeilen und vier Spalten: Eine Ziffer kommt in vier Zeilen nur in insgesamt vier Spalten vor. In diesen Spalten wird sie in allen anderen Zeilen gestrichen.","how":["Wie beim Swordfish, aber mit vier Zeilen (je zwei bis vier Plätze) und genau vier Spalten.","Die Ziffer in diesen vier Spalten außerhalb der vier Zeilen streichen."],"example":["Die <b>8<\/b> steht in Zeile 1, 3, 6 und 9 nur in den Spalten 2, 4, 6 und 8.","In diesen Spalten wird die 8 in den übrigen Zeilen gestrichen, z. B. in Z5S4 und Z7S2."],"tip":"Jellyfish kommen selten vor. Wenn eine Ziffer überall sehr verstreut ist, lohnt sich eher die Suche nach Ketten.","board":{"rows":[0,1,2,3,4,5,6,7,8],"cols":[0,1,2,3,4,5,6,7,8],"givens":{},"cands":{"Z1S2":"8","Z1S4":"8","Z3S4":"8","Z3S6":"8","Z6S6":"8","Z6S8":"8","Z9S2":"8","Z9S8":"8","Z5S4":"48","Z7S2":"18"},"fills":{},"shade":["Z1S1","Z1S2","Z1S3","Z1S4","Z1S5","Z1S6","Z1S7","Z1S8","Z1S9","Z3S1","Z3S2","Z3S3","Z3S4","Z3S5","Z3S6","Z3S7","Z3S8","Z3S9","Z6S1","Z6S2","Z6S3","Z6S4","Z6S5","Z6S6","Z6S7","Z6S8","Z6S9","Z9S1","Z9S2","Z9S3","Z9S4","Z9S5","Z9S6","Z9S7","Z9S8","Z9S9"],"mark":{"Z1S2":{"8":"g"},"Z1S4":{"8":"g"},"Z3S4":{"8":"g"},"Z3S6":{"8":"g"},"Z6S6":{"8":"g"},"Z6S8":{"8":"g"},"Z9S2":{"8":"g"},"Z9S8":{"8":"g"},"Z5S4":{"8":"x"},"Z7S2":{"8":"x"}},"links":[]}},{"name":"Einfache Färbung","english":"Simple Coloring (Single's Chains)","level":4,"idea":"Man verfolgt für eine Ziffer eine Kette starker Verbindungen (Einheiten mit genau zwei Plätzen) und färbt die Felder abwechselnd in zwei Farben. Genau eine der beiden Farben ist „wahr“ – entweder alle blauen oder alle grünen Felder enthalten die Ziffer.","how":["Ziffer wählen, Einheiten mit genau zwei Plätzen für sie markieren.","Ausgehend von einem Feld entlang dieser Paare abwechselnd blau/grün färben.","<b>Regel „Falle“<\/b>: Ein ungefärbtes Feld, das ein blaues <i>und<\/i> ein grünes Feld sieht, kann die Ziffer nicht haben – eine der Farben ist ja wahr.","<b>Regel „Widerspruch“<\/b>: Sehen sich zwei Felder derselben Farbe, ist diese Farbe falsch – die Ziffer in allen Feldern dieser Farbe streichen (und die andere Farbe setzen)."],"example":["Für die <b>2<\/b> gibt es genau zwei Plätze in Zeile 1 (Z1S1, Z1S6), in Spalte 6 (Z1S6, Z7S6) und in Zeile 7 (Z7S6, Z7S2).","Färbung: blau Z1S1, Z7S6 – grün Z1S6, Z7S2.","Z8S1 sieht das blaue Z1S1 (Spalte 1) und das grüne Z7S2 (Block 7). Welche Farbe auch wahr ist: Z8S1 kann keine 2 sein."],"tip":null,"board":{"rows":[0,1,2,3,4,5,6,7,8],"cols":[0,1,2,3,4,5,6,7,8],"givens":{},"cands":{"Z1S1":"2","Z1S6":"2","Z7S6":"2","Z7S2":"2","Z8S1":"29"},"fills":{"Z1S1":"#cfe0f7","Z7S6":"#cfe0f7","Z1S6":"#cdeccf","Z7S2":"#cdeccf"},"shade":[],"mark":{"Z1S1":{"2":"b"},"Z7S6":{"2":"b"},"Z1S6":{"2":"g"},"Z7S2":{"2":"g"},"Z8S1":{"2":"x"}},"links":[["Z1S1","Z1S6","s"],["Z1S6","Z7S6","s"],["Z7S6","Z7S2","s"]]}},{"name":"W-Wing","english":"W-Wing","level":4,"idea":"Zwei Felder mit denselben zwei Kandidaten {X,Y}, die sich nicht sehen, werden über eine starke Verbindung von X verknüpft. Dann ist mindestens eines der beiden Felder Y.","how":["Zwei gleiche Zweier-Felder {X,Y} suchen, die sich nicht sehen.","Eine Einheit finden, in der X genau zwei Plätze hat, wobei der eine Platz das erste und der andere das zweite Feld sieht.","Y in allen Feldern streichen, die beide Zweier-Felder sehen."],"example":["Z2S2 und Z8S7 sind beide {4,8}. In Zeile 5 hat die 4 nur die Plätze Z5S2 und Z5S7.","Wäre Z2S2 nicht 8, dann wäre es 4. Dann ist Z5S2 nicht 4, also Z5S7 = 4, also ist Z8S7 nicht 4 und damit 8. Eines der beiden ist also <b>8<\/b>.","Die 8 wird in Z2S7 und Z8S2 gestrichen – sie sehen beide Felder."],"tip":null,"board":{"rows":[0,1,2,3,4,5,6,7,8],"cols":[0,1,2,3,4,5,6,7,8],"givens":{},"cands":{"Z2S2":"48","Z8S7":"48","Z5S2":"4","Z5S7":"4","Z2S7":"18","Z8S2":"68"},"fills":{"Z2S2":"#cfe0f7","Z8S7":"#cfe0f7"},"shade":["Z5S1","Z5S2","Z5S3","Z5S4","Z5S5","Z5S6","Z5S7","Z5S8","Z5S9"],"mark":{"Z2S2":{"8":"b","4":"g"},"Z8S7":{"8":"b","4":"g"},"Z5S2":{"4":"g"},"Z5S7":{"4":"g"},"Z2S7":{"8":"x"},"Z8S2":{"8":"x"}},"links":[["Z2S2","Z5S2","w"],["Z5S2","Z5S7","s"],["Z5S7","Z8S7","w"]]}},{"name":"X-Kette","english":"X-Chain (Skyscraper, 2-String Kite, Turbot Fish)","level":4,"idea":"Eine Kette für <i>eine<\/i> Ziffer, in der sich starke und schwache Verbindungen abwechseln. Sie beginnt und endet mit einer starken Verbindung. Dann ist mindestens eines der beiden Enden die Ziffer. Felder, die beide Enden sehen, scheiden aus. Bekannte kurze X-Ketten heißen Skyscraper, 2-String-Kite und Turbot-Fish.","how":["Ziffer wählen und starke Verbindungen markieren (Einheiten mit genau zwei Plätzen).","Starke Verbindungen über schwache Verbindungen (Felder, die sich sehen) aneinanderhängen: stark – schwach – stark – …","Endet die Kette mit einer starken Verbindung: Die Ziffer in allen Feldern streichen, die Anfang und Ende sehen."],"example":["„Skyscraper“ für die <b>6<\/b>: In Spalte 2 nur Z2S2/Z8S2, in Spalte 7 nur Z3S7/Z8S7. Die unteren Enden Z8S2 und Z8S7 sehen sich (Zeile 8).","Höchstens eines der unteren Enden ist 6 – also ist Z2S2 oder Z3S7 eine 6.","Gestrichen wird die 6 in Feldern, die beide oberen Enden sehen: z. B. Z2S9 und Z3S1 (auch Z2S8, Z3S3)."],"tip":null,"board":{"rows":[0,1,2,3,4,5,6,7,8],"cols":[0,1,2,3,4,5,6,7,8],"givens":{},"cands":{"Z2S2":"6","Z8S2":"6","Z8S7":"6","Z3S7":"6","Z2S9":"67","Z3S1":"56"},"fills":{"Z2S2":"#cdeccf","Z3S7":"#cdeccf"},"shade":[],"mark":{"Z2S2":{"6":"g"},"Z3S7":{"6":"g"},"Z8S2":{"6":"b"},"Z8S7":{"6":"b"},"Z2S9":{"6":"x"},"Z3S1":{"6":"x"}},"links":[["Z2S2","Z8S2","s"],["Z8S2","Z8S7","w"],["Z8S7","Z3S7","s"]]}},{"name":"XY-Kette","english":"XY-Chain","level":4,"idea":"Eine Kette aus Feldern mit genau zwei Kandidaten, in der benachbarte Felder sich sehen und eine Ziffer gemeinsam haben. Ist das Anfangsfeld nicht Z, erzwingt die Kette Feld für Feld, dass das Endfeld Z ist. Also ist Anfang oder Ende Z. Der XY-Wing ist die kürzeste XY-Kette.","how":["Mit einem Zweier-Feld {Z,A} beginnen und annehmen: Es ist nicht Z, also A.","Zu einem Zweier-Feld gehen, das dieses sieht und A enthält: Es ist nicht A, also seine andere Ziffer. So weiter.","Erreicht die Kette ein Feld, das dadurch Z wird: Z in allen Feldern streichen, die Anfang und Ende sehen."],"example":["Kette: Z1S1 {1,2} → Z1S5 {2,3} → Z4S5 {3,4} → Z4S9 {4,1}.","Ist Z1S1 nicht 1, ist es 2 → Z1S5 = 3 → Z4S5 = 4 → Z4S9 = <b>1<\/b>. Also ist Z1S1 oder Z4S9 eine 1.","Z1S9 und Z4S1 sehen beide Enden → 1 streichen."],"tip":null,"board":{"rows":[0,1,2,3,4,5],"cols":[0,1,2,3,4,5,6,7,8],"givens":{},"cands":{"Z1S1":"12","Z1S5":"23","Z4S5":"34","Z4S9":"14","Z1S9":"17","Z4S1":"16"},"fills":{"Z1S1":"#cdeccf","Z1S5":"#cfe0f7","Z4S5":"#cfe0f7","Z4S9":"#cdeccf"},"shade":[],"mark":{"Z1S1":{"1":"g"},"Z4S9":{"1":"g"},"Z1S9":{"1":"x"},"Z4S1":{"1":"x"}},"links":[["Z1S1","Z1S5","w"],["Z1S5","Z4S5","w"],["Z4S5","Z4S9","w"]]}},{"name":"Erzwingungsketten","english":"Forcing Chains, AIC","level":5,"idea":"Man verfolgt von einem Feld (oder einer Einheit) aus <i>alle<\/i> Möglichkeiten. Führen alle Möglichkeiten zum selben Ergebnis, ist dieses Ergebnis sicher.","how":["<b>Feld-Erzwingung<\/b>: Ein Feld hat z. B. die Kandidaten {3,8}. Verfolge die Folgen von „= 3“ und von „= 8“. Wird in beiden Fällen dasselbe Feld 5, ist es sicher 5.","<b>Einheiten-Erzwingung<\/b>: Eine Ziffer hat in einer Einheit mehrere Plätze. Folgt aus jedem Platz dasselbe, gilt es sicher.","<b>Alternierende Ketten (AIC)<\/b>: Verallgemeinerung von X- und XY-Kette. Starke und schwache Verbindungen dürfen beliebig zwischen Ziffern und Feldern wechseln."],"example":["Ketten lassen sich am besten mit eingetragenen Kandidaten und Notizen auf Papier verfolgen. Lange Ketten sind fehleranfällig – nach jedem Schritt prüfen."],"tip":null,"board":null},{"name":"Ausprobieren (Nishio, Verzweigung)","english":"Trial and Error, Bifurcation","level":5,"idea":"Man nimmt für ein Feld mit zwei Kandidaten eine Ziffer an und löst weiter. Führt das zu einem Widerspruch (Feld ohne Kandidaten, Ziffer doppelt), war die Annahme falsch – dann gilt die andere Ziffer.","how":["Ein Feld mit nur zwei Kandidaten wählen. Am besten eines, das viele andere beeinflusst.","Den aktuellen Stand sichern. Im Programm: Rückgängig (Strg+Z) bringt dich zurück.","Eine Ziffer annehmen und mit einfachen Techniken weiterlösen.","Bei einem Widerspruch zurückgehen und die andere Ziffer setzen. Wird das Rätsel ohne Widerspruch gelöst, war die Annahme richtig."],"example":["Puristen lehnen Ausprobieren ab, logisch ist es aber korrekt. Erzwingungsketten sind im Grunde nur geordnetes Ausprobieren."],"tip":null,"board":null}]};

<script>
/* Sudoku-Kern: Gebietskarte, Löser, Lösungstechniken, Bewertung, Tipps,
 * Generator und Spielzustand. JavaScript-Fassung des Python-Programms
 * (sudoku_app/*.py) – gleiche Logik, gleiche Ergebnisse.
 * Läuft im Browser (window.SudokuCore) und in Node (require).
 */
(function (root) {
  "use strict";

  // ------------------------------------------------------------ Grundlagen
  const ALL = 0b1111111110;                      // Bits 1..9
  const POP = new Uint8Array(1024);
  const DIGITS_OF = [];
  for (let m = 0; m < 1024; m++) {
    let n = 0; const ds = [];
    for (let d = 1; d <= 9; d++) if (m >> d & 1) { n++; ds.push(d); }
    POP[m] = n; DIGITS_OF.push(ds);
  }
  const range = (n) => Array.from({ length: n }, (_, i) => i);
  const ROW_OF = range(81).map(i => Math.floor(i / 9));
  const COL_OF = range(81).map(i => i % 9);
  const ROWS = range(9).map(r => range(9).map(c => r * 9 + c));
  const COLS = range(9).map(c => range(9).map(r => r * 9 + c));
  const CLASSIC_REGIONS = range(81).map(i => Math.floor(i / 27) * 3 + Math.floor((i % 9) / 3));
  const DIAG_DOWN = range(9).map(r => r * 9 + r);
  const DIAG_UP = range(9).map(r => r * 9 + 8 - r);
  const DIAG_CELLS = new Set([...DIAG_DOWN, ...DIAG_UP]);
  // Farbsudoku: Gruppe = Position im 3x3-Block (0 = links oben … 8 = rechts unten)
  const COLOR_OF = range(81).map(i => (Math.floor(i / 9) % 3) * 3 + i % 3);
  const COLOR_GROUPS = range(9).map(k => range(81).filter(i => COLOR_OF[i] === k));
  const COLOR_NAMES = ["Rot", "Orange", "Gelb", "Grün", "Türkis", "Blau", "Violett", "Rosa", "Grau"];
  const REGION_CHARS = "123456789";
  const LEVEL_NAMES = { 1: "Leicht", 2: "Mittel", 3: "Schwer", 4: "Sehr schwer", 5: "Extrem" };
  const MIN_GIVENS = { 1: 36, 2: 28, 3: 24, 4: 17, 5: 17 };
  const MAX_LEVEL = 5;

  function* combinations(arr, n, start = 0, prefix = []) {
    if (prefix.length === n) { yield prefix.slice(); return; }
    for (let i = start; i <= arr.length - (n - prefix.length); i++) {
      prefix.push(arr[i]);
      yield* combinations(arr, n, i + 1, prefix);
      prefix.pop();
    }
  }

  function neighbours(i) {
    const r = Math.floor(i / 9), c = i % 9, out = [];
    if (r > 0) out.push(i - 9);
    if (r < 8) out.push(i + 9);
    if (c > 0) out.push(i - 1);
    if (c < 8) out.push(i + 1);
    return out;
  }

  // Zufallszahlen (mit Startwert reproduzierbar)
  function makeRng(seed) {
    let a = (seed === undefined ? Math.floor(Math.random() * 2 ** 32) : seed) >>> 0;
    const rng = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    rng.int = (n) => Math.floor(rng() * n);                 // 0..n-1
    rng.randint = (a, b) => a + Math.floor(rng() * (b - a + 1));
    rng.choice = (arr) => arr[Math.floor(rng() * arr.length)];
    rng.shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };
    return rng;
  }

  // ------------------------------------------------------------ Gebiete
  function normalize(regions) {
    const map = new Map();
    return regions.map(r => { if (!map.has(r)) map.set(r, map.size); return map.get(r); });
  }

  function regionProblems(regions) {
    if (regions.length !== 81) return ["Die Gebietskarte muss 81 Felder haben."];
    const problems = [];
    const ids = [...new Set(regions)].sort((a, b) => a - b);
    if (ids.length !== 9) problems.push(`Es gibt ${ids.length} statt 9 Gebiete.`);
    for (const r of ids) {
      const cells = range(81).filter(i => regions[i] === r);
      const name = r >= 0 && r < 9 ? REGION_CHARS[r] : r;
      if (cells.length !== 9) { problems.push(`Gebiet ${name} hat ${cells.length} statt 9 Felder.`); continue; }
      const seen = new Set([cells[0]]), stack = [cells[0]];
      while (stack.length) {
        const c = stack.pop();
        for (const n of neighbours(c)) if (regions[n] === r && !seen.has(n)) { seen.add(n); stack.push(n); }
      }
      if (seen.size !== 9) problems.push(`Gebiet ${name} ist nicht zusammenhängend.`);
    }
    return problems;
  }

  class Layout {
    constructor(regions = null, diagonals = false, colors = false) {
      const reg = regions ? normalize(Array.from(regions)) : CLASSIC_REGIONS.slice();
      const probs = regionProblems(reg);
      if (probs.length) throw new Error("Ungültige Gebietskarte: " + probs.join(" "));
      this.regionOf = reg;
      this.regions = range(9).map(g => range(81).filter(i => reg[i] === g));
      this.diagonals = !!diagonals;
      this.colors = !!colors;
      const classicReg = reg.every((g, i) => g === CLASSIC_REGIONS[i]);
      if (this.colors && !classicReg) throw new Error("Farbsudoku gibt es nur mit 3x3-Blöcken.");
      this.units = [...ROWS, ...COLS, ...this.regions];
      if (this.diagonals) this.units.push(DIAG_DOWN, DIAG_UP);
      this.colorBase = this.units.length;
      if (this.colors) this.units.push(...COLOR_GROUPS);
      this.unitsOf = range(81).map(i => this.units.map((u, k) => u.includes(i) ? k : -1).filter(k => k >= 0));
      this.sees = new Uint8Array(81 * 81);
      this.peers = range(81).map(i => {
        const s = new Set();
        for (const u of this.unitsOf[i]) for (const j of this.units[u]) if (j !== i) s.add(j);
        const arr = [...s].sort((a, b) => a - b);
        for (const j of arr) this.sees[i * 81 + j] = 1;
        return arr;
      });
      this.classicRegions = reg.every((g, i) => g === CLASSIC_REGIONS[i]);
      this.squiggly = !this.classicRegions;
      this.classic = this.classicRegions && !this.diagonals && !this.colors;
    }
    key() { return this.regionOf.map(g => REGION_CHARS[g]).join(""); }
    get kind() {
      if (this.colors) return this.diagonals ? "Farbsudoku-X" : "Farbsudoku";
      if (this.squiggly) return this.diagonals ? "Squiggly-X" : "Squiggly";
      return this.diagonals ? "X-Sudoku" : "Sudoku";
    }
    unitName(u) {
      if (u < 9) return `Zeile ${u + 1}`;
      if (u < 18) return `Spalte ${u - 8}`;
      if (u < 27) return `${this.squiggly ? "Gebiet" : "Block"} ${u - 17}`;
      if (u >= this.colorBase) return `der Farbgruppe ${COLOR_NAMES[u - this.colorBase]}`;
      return u === 27 ? "der Diagonale ↘" : "der Diagonale ↙";
    }
    canSee(a, b) { return this.sees[a * 81 + b] === 1; }
    equals(o) {
      return o instanceof Layout && o.diagonals === this.diagonals && o.colors === this.colors && o.key() === this.key();
    }
  }
  const CLASSIC = new Layout();

  const cellName = (i) => `Zeile ${ROW_OF[i] + 1}, Spalte ${COL_OF[i] + 1}`;

  function candidates(grid, i, layout = CLASSIC) {
    if (grid[i]) return 0;
    let m = ALL;
    for (const p of layout.peers[i]) if (grid[p]) m &= ~(1 << grid[p]);
    return m;
  }

  function conflicts(grid, layout = CLASSIC) {
    return unitConflicts(grid, layout.units);
  }
  function unitConflicts(grid, units) {
    const bad = new Set();
    for (const unit of units) {
      const seen = {};
      for (const i of unit) if (grid[i]) (seen[grid[i]] = seen[grid[i]] || []).push(i);
      for (const cells of Object.values(seen)) if (cells.length > 1) cells.forEach(c => bad.add(c));
    }
    return bad;
  }

  // ------------------------------------------------------------ Codes
  function parsePuzzle(text) {
    const cells = [...text].filter(ch => "0123456789.-_*".includes(ch));
    if (cells.length !== 81) throw new Error(`Es wurden ${cells.length} statt 81 Felder gefunden.`);
    return cells.map(ch => (ch >= "0" && ch <= "9") ? +ch : 0);
  }
  function parseRegions(text) {
    const chars = [...text].map(c => c.toLowerCase()).filter(c => REGION_CHARS.includes(c) || "abcdefghi".includes(c));
    if (chars.length !== 81) throw new Error(`Gebietskarte: ${chars.length} statt 81 Felder gefunden.`);
    return chars.map(c => (c >= "1" && c <= "9") ? +c - 1 : "abcdefghi".indexOf(c));
  }
  function parseCode(text) {
    let t = text.trim(), diagonals = false, colors = false;
    const f = t.lastIndexOf("|");
    if (f >= 0) {
      const flags = t.slice(f + 1).trim().toUpperCase();
      if (flags && flags.length <= 2 && /^[XF]+$/.test(flags)) {
        diagonals = flags.includes("X"); colors = flags.includes("F"); t = t.slice(0, f);
      }
    }
    let grid = null, layout = CLASSIC;
    const k = t.lastIndexOf("|");
    if (k >= 0) {
      try { grid = parsePuzzle(t.slice(0, k)); layout = new Layout(parseRegions(t.slice(k + 1))); }
      catch (e) { grid = null; layout = CLASSIC; }
    }
    if (!grid) grid = parsePuzzle(t);
    return [grid, diagonals || colors ? new Layout(layout.regionOf, diagonals, colors) : layout];
  }
  const toString = (grid) => grid.map(v => v ? String(v) : ".").join("");
  function toCode(grid, layout = CLASSIC) {
    let code = toString(grid);
    if (layout.squiggly) code += "|" + layout.key();
    const flags = (layout.diagonals ? "X" : "") + (layout.colors ? "F" : "");
    if (flags) code += "|" + flags;
    return code;
  }

  // ------------------------------------------------------------ Löser
  class SearchAborted extends Error {}

  function search(grid, limit, rng = null, layout = CLASSIC, maxNodes = null) {
    const BOX = layout.regionOf;
    const D1 = new Int8Array(81).fill(2), D2 = new Int8Array(81).fill(2);
    if (layout.diagonals) for (let i = 0; i < 81; i++) {
      if (ROW_OF[i] === COL_OF[i]) D1[i] = 0;
      if (ROW_OF[i] + COL_OF[i] === 8) D2[i] = 1;
    }
    // Farbsudoku: Farbgruppe je Feld, 9 = keine (Dummy, nie belegt)
    const GRP = layout.colors ? COLOR_OF : new Array(81).fill(9);
    const g = Array.from(grid);
    const rows = new Int32Array(9), cols = new Int32Array(9), boxes = new Int32Array(9), diag = new Int32Array(3);
    const grp = new Int32Array(10);
    for (let i = 0; i < 81; i++) {
      const v = g[i];
      if (!v) continue;
      const b = 1 << v, r = ROW_OF[i], c = COL_OF[i], x = BOX[i];
      if ((rows[r] | cols[c] | boxes[x] | diag[D1[i]] | diag[D2[i]] | grp[GRP[i]]) & b) return [0, null];
      rows[r] |= b; cols[c] |= b; boxes[x] |= b;
      if (GRP[i] < 9) grp[GRP[i]] |= b;
      if (D1[i] < 2) diag[0] |= b;
      if (D2[i] < 2) diag[1] |= b;
    }
    const empties = range(81).filter(i => !g[i]);
    const units = layout.units;
    const cb = layout.colorBase;
    const placed = (u) => u < 9 ? rows[u] : u < 18 ? cols[u - 9] : u < 27 ? boxes[u - 18] : u >= cb ? grp[u - cb] : diag[u - 27];
    const state = { count: 0, first: null, nodes: 0 };
    const masks = new Int32Array(81);

    function rec() {
      if (maxNodes !== null && ++state.nodes > maxNodes) throw new SearchAborted();
      let best = -1, bestMask = 0, bestN = 10;
      masks.fill(0);
      for (const i of empties) {
        if (g[i]) continue;
        const m = ALL & ~(rows[ROW_OF[i]] | cols[COL_OF[i]] | boxes[BOX[i]] | diag[D1[i]] | diag[D2[i]] | grp[GRP[i]]);
        const n = POP[m];
        if (n === 0) return false;
        masks[i] = m;
        if (n < bestN) { best = i; bestMask = m; bestN = n; }
      }
      if (best < 0) {
        state.count++;
        if (state.first === null) state.first = g.slice();
        return state.count >= limit;
      }
      let options = null;
      if (bestN > 1) {
        let pair = null;
        for (let u = 0; u < units.length; u++) {
          const unit = units[u];
          let once = 0, twice = 0, thrice = 0;
          for (const i of unit) { const m = masks[i]; thrice |= twice & m; twice |= once & m; once |= m; }
          const missing = ALL & ~placed(u);
          if (missing & ~once) return false;
          const single = missing & once & ~twice;
          if (single) {
            const d = DIGITS_OF[single][0], bit = 1 << d;
            options = [[unit.find(i => masks[i] & bit), d]];
            break;
          }
          if (pair === null && bestN > 2) {
            const two = missing & twice & ~thrice;
            if (two) {
              const d = DIGITS_OF[two][0], bit = 1 << d;
              pair = unit.filter(i => masks[i] & bit).map(i => [i, d]);
            }
          }
        }
        if (options === null && pair !== null) options = pair;
      }
      if (options === null) {
        let digits = DIGITS_OF[bestMask];
        if (rng) digits = rng.shuffle(digits.slice());
        options = digits.map(d => [best, d]);
      } else if (rng && options.length > 1) {
        options = rng.shuffle(options.slice());
      }
      for (const [cell, d] of options) {
        const b = 1 << d, r = ROW_OF[cell], c = COL_OF[cell], x = BOX[cell];
        if ((rows[r] | cols[c] | boxes[x] | diag[D1[cell]] | diag[D2[cell]] | grp[GRP[cell]]) & b) continue;
        const d1 = D1[cell], d2 = D2[cell], k = GRP[cell];
        g[cell] = d; rows[r] |= b; cols[c] |= b; boxes[x] |= b;
        if (d1 < 2) diag[0] |= b;
        if (d2 < 2) diag[1] |= b;
        if (k < 9) grp[k] |= b;
        const stop = rec();
        g[cell] = 0; rows[r] ^= b; cols[c] ^= b; boxes[x] ^= b;
        if (d1 < 2) diag[0] ^= b;
        if (d2 < 2) diag[1] ^= b;
        if (k < 9) grp[k] ^= b;
        if (stop) return true;
      }
      return false;
    }
    rec();
    return [state.count, state.first];
  }

  const solve = (grid, layout = CLASSIC) => search(grid, 1, null, layout)[1];
  const countSolutions = (grid, limit = 2, layout = CLASSIC) => search(grid, limit, null, layout)[0];
  function randomSolution(rng = makeRng(), layout = CLASSIC, maxNodes = null) {
    try { return search(new Array(81).fill(0), 1, rng, layout, maxNodes)[1]; }
    catch (e) { if (e instanceof SearchAborted) return null; throw e; }
  }

  // ------------------------------------------------------------ Logischer Löser
  class LogicSolver {
    constructor(grid, layout = CLASSIC) {
      this.L = layout;
      this.values = Array.from(grid);
      this.cand = new Array(81).fill(0);
      for (let i = 0; i < 81; i++) if (!this.values[i]) {
        let m = ALL;
        for (const p of layout.peers[i]) if (this.values[p]) m &= ~(1 << this.values[p]);
        this.cand[i] = m;
      }
    }
    place(i, d) {
      this.values[i] = d; this.cand[i] = 0;
      const b = ~(1 << d);
      for (const p of this.L.peers[i]) this.cand[p] &= b;
    }
    solved() { return this.values.every(v => v); }
    broken() { return this.values.some((v, i) => !v && !this.cand[i]); }
    _elim(cells, mask) {
      let changed = false;
      for (const i of cells) if (this.cand[i] & mask) { this.cand[i] &= ~mask; changed = true; }
      return changed;
    }
    sees(a, b) { return this.L.canSee(a, b); }

    findNakedSingle() {
      for (let i = 0; i < 81; i++) if (!this.values[i] && POP[this.cand[i]] === 1) return [i, DIGITS_OF[this.cand[i]][0]];
      return null;
    }
    findHiddenSingle() {
      const units = this.L.units;
      for (let u = 0; u < units.length; u++) for (let d = 1; d <= 9; d++) {
        const b = 1 << d;
        let pos = -1, n = 0;
        for (const i of units[u]) if (this.cand[i] & b) { n++; pos = i; if (n > 1) break; }
        if (n === 1) return [pos, d, u];
      }
      return null;
    }
    nakedSingle() { const r = this.findNakedSingle(); if (r) { this.place(r[0], r[1]); return true; } return false; }
    hiddenSingle() { const r = this.findHiddenSingle(); if (r) { this.place(r[0], r[1]); return true; } return false; }

    lockedCandidates() {
      const units = this.L.units;
      for (let u = 0; u < units.length; u++) {
        const unit = units[u];
        for (let d = 1; d <= 9; d++) {
          const bit = 1 << d;
          const pos = unit.filter(i => this.cand[i] & bit);
          if (pos.length < 2) continue;
          for (const other of this.L.unitsOf[pos[0]]) {
            if (other === u) continue;
            const target = units[other];
            if (pos.every(i => target.includes(i))) {
              const rest = target.filter(i => !unit.includes(i));
              if (this._elim(rest, bit)) return true;
            }
          }
        }
      }
      return false;
    }
    nakedSubset(n) {
      for (const unit of this.L.units) {
        const empties = unit.filter(i => !this.values[i]);
        if (empties.length <= n) continue;
        for (const combo of combinations(empties, n)) {
          let union = 0;
          for (const i of combo) union |= this.cand[i];
          if (POP[union] === n) {
            const rest = empties.filter(i => !combo.includes(i));
            if (this._elim(rest, union)) return true;
          }
        }
      }
      return false;
    }
    hiddenSubset(n) {
      for (const unit of this.L.units) {
        const placed = new Set(unit.filter(i => this.values[i]).map(i => this.values[i]));
        const open = range(9).map(k => k + 1).filter(d => !placed.has(d));
        if (open.length <= n) continue;
        for (const digits of combinations(open, n)) {
          let mask = 0;
          for (const d of digits) mask |= 1 << d;
          const cells = unit.filter(i => this.cand[i] & mask);
          if (cells.length !== n) continue;
          if (digits.some(d => !cells.some(i => this.cand[i] & (1 << d)))) continue;
          let changed = false;
          for (const i of cells) if (this.cand[i] & ~mask) { this.cand[i] &= mask; changed = true; }
          if (changed) return true;
        }
      }
      return false;
    }
    fish(n) {
      for (let d = 1; d <= 9; d++) {
        const bit = 1 << d;
        for (const [lines, cross] of [[ROWS, COLS], [COLS, ROWS]]) {
          const candLines = [];
          lines.forEach((line, k) => {
            const pos = [];
            line.forEach((i, j) => { if (this.cand[i] & bit) pos.push(j); });
            if (pos.length >= 2 && pos.length <= n) candLines.push([k, pos]);
          });
          if (candLines.length < n) continue;
          for (const combo of combinations(candLines, n)) {
            const union = new Set();
            for (const [, pos] of combo) pos.forEach(j => union.add(j));
            if (union.size !== n) continue;
            const ks = new Set(combo.map(([k]) => k));
            let changed = false;
            for (const j of union) {
              const others = cross[j].filter((i, k) => !ks.has(k));
              if (this._elim(others, bit)) changed = true;
            }
            if (changed) return true;
          }
        }
      }
      return false;
    }
    xyWing() {
      const biv = range(81).filter(i => !this.values[i] && POP[this.cand[i]] === 2);
      const bset = new Set(biv);
      for (const pivot of biv) {
        const pm = this.cand[pivot];
        const wings = this.L.peers[pivot].filter(i => bset.has(i) && POP[this.cand[i] & pm] === 1);
        for (const [a, b] of combinations(wings, 2)) {
          const ma = this.cand[a], mb = this.cand[b];
          if ((ma & pm) === (mb & pm)) continue;
          const z = ma & mb & ~pm;
          if (POP[z & 1023] !== 1 || ((ma | mb) & ~pm) !== z) continue;
          const targets = range(81).filter(i => i !== a && i !== b && i !== pivot && this.sees(i, a) && this.sees(i, b));
          if (this._elim(targets, z)) return true;
        }
      }
      return false;
    }
    xyzWing() {
      for (let pivot = 0; pivot < 81; pivot++) {
        const pm = this.cand[pivot];
        if (this.values[pivot] || POP[pm] !== 3) continue;
        const wings = this.L.peers[pivot].filter(i => !this.values[i] && POP[this.cand[i]] === 2 && (this.cand[i] & ~pm) === 0);
        for (const [a, b] of combinations(wings, 2)) {
          const ma = this.cand[a], mb = this.cand[b];
          if (ma === mb || (ma | mb) !== pm) continue;
          const z = ma & mb;
          const targets = range(81).filter(i => i !== a && i !== b && i !== pivot &&
            this.sees(i, a) && this.sees(i, b) && this.sees(i, pivot));
          if (this._elim(targets, z)) return true;
        }
      }
      return false;
    }
    _strongLinks(bit) {
      const adj = new Map();
      for (const unit of this.L.units) {
        const pos = unit.filter(i => this.cand[i] & bit);
        if (pos.length === 2) {
          const [a, b] = pos;
          if (!adj.has(a)) adj.set(a, new Set());
          if (!adj.has(b)) adj.set(b, new Set());
          adj.get(a).add(b); adj.get(b).add(a);
        }
      }
      return adj;
    }
    simpleColoring() {
      for (let d = 1; d <= 9; d++) {
        const bit = 1 << d;
        const adj = this._strongLinks(bit);
        const done = new Set();
        for (const start of adj.keys()) {
          if (done.has(start)) continue;
          const color = new Map([[start, 0]]);
          const stack = [start];
          while (stack.length) {
            const c = stack.pop();
            for (const n of [...adj.get(c)].sort((x, y) => x - y)) {
              if (!color.has(n)) { color.set(n, 1 - color.get(c)); stack.push(n); }
            }
          }
          for (const k of color.keys()) done.add(k);
          if (color.size < 3) continue;
          const groups = [0, 1].map(k => [...color.entries()].filter(([, v]) => v === k).map(([c]) => c));
          for (const g of groups) {
            let clash = false;
            for (const [a, b] of combinations(g, 2)) if (this.sees(a, b)) { clash = true; break; }
            if (clash && this._elim(g, bit)) return true;
          }
          const targets = range(81).filter(i => (this.cand[i] & bit) && !color.has(i) &&
            groups[0].some(a => this.sees(i, a)) && groups[1].some(b => this.sees(i, b)));
          if (this._elim(targets, bit)) return true;
        }
      }
      return false;
    }
    wWing() {
      const biv = range(81).filter(i => !this.values[i] && POP[this.cand[i]] === 2);
      for (const [a, b] of combinations(biv, 2)) {
        if (this.cand[a] !== this.cand[b] || this.sees(a, b)) continue;
        const [x, y] = DIGITS_OF[this.cand[a]];
        for (const [link, elim] of [[x, y], [y, x]]) {
          const lb = 1 << link;
          for (const unit of this.L.units) {
            const pos = unit.filter(i => this.cand[i] & lb);
            if (pos.length !== 2 || pos.includes(a) || pos.includes(b)) continue;
            const [p, q] = pos;
            if ((this.sees(p, a) && this.sees(q, b)) || (this.sees(p, b) && this.sees(q, a))) {
              const targets = range(81).filter(i => i !== a && i !== b && this.sees(i, a) && this.sees(i, b));
              if (this._elim(targets, 1 << elim)) return true;
            }
          }
        }
      }
      return false;
    }
    xyChain(maxLen = 14) {
      const biv = range(81).filter(i => !this.values[i] && POP[this.cand[i]] === 2);
      const bset = new Set(biv);
      for (const start of biv) {
        for (const z of DIGITS_OF[this.cand[start]]) {
          const zb = 1 << z;
          const first = DIGITS_OF[this.cand[start] & ~zb][0];
          let frontier = [[start, first]];
          const seen = new Set([start * 10 + first]);
          for (let step = 0; step < maxLen; step++) {
            const next = [];
            for (const [cell, val] of frontier) {
              const vb = 1 << val;
              for (const n of this.L.peers[cell]) {
                if (bset.has(n) && (this.cand[n] & vb)) {
                  const forced = DIGITS_OF[this.cand[n] & ~vb][0];
                  if (seen.has(n * 10 + forced)) continue;
                  seen.add(n * 10 + forced);
                  if (forced === z && n !== start) {
                    const targets = range(81).filter(i => i !== start && i !== n && this.sees(i, start) && this.sees(i, n));
                    if (this._elim(targets, zb)) return true;
                  }
                  next.push([n, forced]);
                }
              }
            }
            frontier = next;
            if (!frontier.length) break;
          }
        }
      }
      return false;
    }
    xChain(maxLen = 12) {
      for (let d = 1; d <= 9; d++) {
        const bit = 1 << d;
        const strong = this._strongLinks(bit);
        const cells = range(81).filter(i => this.cand[i] & bit);
        for (const start of strong.keys()) {
          let frontier = [start];
          const seenFalse = new Set([start]), seenTrue = new Set();
          for (let step = 0; step < maxLen; step++) {
            const trues = [];
            for (const c of frontier) {
              const links = strong.has(c) ? [...strong.get(c)].sort((x, y) => x - y) : [];
              for (const t of links) {
                if (seenTrue.has(t)) continue;
                seenTrue.add(t); trues.push(t);
                if (t !== start) {
                  const targets = cells.filter(i => i !== start && i !== t && this.sees(i, start) && this.sees(i, t));
                  if (this._elim(targets, bit)) return true;
                }
              }
            }
            frontier = [];
            for (const t of trues) for (const f of this.L.peers[t]) {
              if ((this.cand[f] & bit) && !seenFalse.has(f)) { seenFalse.add(f); frontier.push(f); }
            }
            if (!frontier.length) break;
          }
        }
      }
      return false;
    }
    leftovers() {
      if (!this.L.squiggly) return false;
      for (const [a, b] of leftoverPairs(this.L)) {
        for (const [x, y] of [[a, b], [b, a]]) {
          let allowed = 0;
          for (const i of y) allowed |= this.cand[i] | (this.values[i] ? 1 << this.values[i] : 0);
          for (const i of x) {
            if (!this.values[i] && (this.cand[i] & ~allowed)) { this.cand[i] &= allowed; return true; }
          }
        }
      }
      return false;
    }
  }

  function leftoverPairs(layout) {
    if (layout._leftovers) return layout._leftovers;
    const pairs = [], seen = new Set();
    for (const lines of [ROWS, COLS]) {
      for (let k = 1; k <= 4; k++) for (let start = 0; start < 10 - k; start++) {
        const band = new Set();
        lines.slice(start, start + k).forEach(line => line.forEach(i => band.add(i)));
        const overlap = (g) => layout.regions[g].filter(i => band.has(i)).length;
        const order = range(9).sort((g1, g2) => overlap(g2) - overlap(g1));   // stabil wie Python
        const regs = new Set();
        order.slice(0, k).forEach(g => layout.regions[g].forEach(i => regs.add(i)));
        const a = [...band].filter(i => !regs.has(i)).sort((x, y) => x - y);
        const b = [...regs].filter(i => !band.has(i)).sort((x, y) => x - y);
        const key = a.join(",") + "|" + b.join(",");
        if (a.length && a.length <= 4 && !seen.has(key)) { seen.add(key); pairs.push([a, b]); }
      }
    }
    layout._leftovers = pairs;
    return pairs;
  }

  const TECHNIQUES = [
    ["Nackter Einzelner", 1, s => s.nakedSingle()],
    ["Versteckter Einzelner", 1, s => s.hiddenSingle()],
    ["Block-Linien-Interaktion", 2, s => s.lockedCandidates()],
    ["Gesetz der Überbleibsel", 2, s => s.leftovers()],
    ["Nacktes Paar", 2, s => s.nakedSubset(2)],
    ["Verstecktes Paar", 2, s => s.hiddenSubset(2)],
    ["Nacktes Tripel", 3, s => s.nakedSubset(3)],
    ["Verstecktes Tripel", 3, s => s.hiddenSubset(3)],
    ["X-Wing", 3, s => s.fish(2)],
    ["XY-Wing", 3, s => s.xyWing()],
    ["XYZ-Wing", 3, s => s.xyzWing()],
    ["Swordfish", 3, s => s.fish(3)],
    ["Nacktes Quadrupel", 4, s => s.nakedSubset(4)],
    ["Verstecktes Quadrupel", 4, s => s.hiddenSubset(4)],
    ["Jellyfish", 4, s => s.fish(4)],
    ["Einfache Färbung", 4, s => s.simpleColoring()],
    ["W-Wing", 4, s => s.wWing()],
    ["X-Kette", 4, s => s.xChain()],
    ["XY-Kette", 4, s => s.xyChain()],
  ];

  function rateDetails(grid, maxLevel = MAX_LEVEL, layout = CLASSIC) {
    const s = new LogicSolver(grid, layout);
    let level = 1;
    const used = {};
    while (!s.solved()) {
      if (s.broken()) return [MAX_LEVEL, used];
      let progressed = false;
      for (const [name, lvl, fn] of TECHNIQUES) {
        if (lvl > maxLevel) return [maxLevel + 1, used];
        if (fn(s)) { level = Math.max(level, lvl); used[name] = (used[name] || 0) + 1; progressed = true; break; }
      }
      if (!progressed) return [MAX_LEVEL, used];
    }
    return [level, used];
  }
  const rate = (grid, maxLevel = MAX_LEVEL, layout = CLASSIC) => rateDetails(grid, maxLevel, layout)[0];

  function findHint(grid, layout = CLASSIC) {
    const s = new LogicSolver(grid, layout);
    if (s.broken()) return null;
    const used = [];
    for (let k = 0; k < 300; k++) {
      const prefix = used.length ? `Nach Ausschlüssen (${[...new Set(used)].join(", ")}) gilt: ` : "";
      let r = s.findNakedSingle();
      if (r) return { cell: r[0], digit: r[1], text: `${prefix}In ${cellName(r[0])} ist nur noch die ${r[1]} möglich.`, techniques: used, single: "Nackter Einzelner" };
      r = s.findHiddenSingle();
      if (r) return { cell: r[0], digit: r[1], text: `${prefix}Die ${r[1]} passt in ${layout.unitName(r[2])} nur in dieses Feld (${cellName(r[0])}).`, techniques: used, single: "Versteckter Einzelner" };
      let progressed = false;
      for (const [name, , fn] of TECHNIQUES.slice(2)) if (fn(s)) { used.push(name); progressed = true; break; }
      if (!progressed) return null;
    }
    return null;
  }

  // ------------------------------------------------------------ Generator
  function connected(cells) {
    if (!cells.size) return true;
    const start = cells.values().next().value;
    const seen = new Set([start]), stack = [start];
    while (stack.length) {
      const c = stack.pop();
      for (const n of neighbours(c)) if (cells.has(n) && !seen.has(n)) { seen.add(n); stack.push(n); }
    }
    return seen.size === cells.size;
  }

  function randomRegions(rng, solution, target = null) {
    target = target || rng.randint(16, 28);
    const reg = CLASSIC_REGIONS.slice();
    const members = range(9).map(g => new Set(range(81).filter(i => reg[i] === g)));
    const where = new Map();
    for (let i = 0; i < 81; i++) where.set(reg[i] * 10 + solution[i], i);
    let moved = 0, tries = 0;
    while (moved < target && tries < 20000) {
      tries++;
      const a = rng.int(81), ra = reg[a];
      const nb = neighbours(a).filter(n => reg[n] !== ra);
      if (!nb.length) continue;
      const rb = reg[rng.choice(nb)];
      const b = where.get(rb * 10 + solution[a]);
      if (rb === CLASSIC_REGIONS[a] || ra === CLASSIC_REGIONS[b]) continue;
      if (!neighbours(b).some(n => reg[n] === ra && n !== a)) continue;
      const newA = new Set(members[ra]); newA.delete(a); newA.add(b);
      const newB = new Set(members[rb]); newB.delete(b); newB.add(a);
      if (!connected(newA) || !connected(newB)) continue;
      members[ra] = newA; members[rb] = newB;
      reg[a] = rb; reg[b] = ra;
      where.set(ra * 10 + solution[a], b); where.set(rb * 10 + solution[a], a);
      moved = reg.filter((g, i) => g !== CLASSIC_REGIONS[i]).length;
    }
    return reg;
  }

  function acceptable(reg) {
    const groups = range(9).map(g => range(81).filter(i => reg[i] === g));
    const lines = [...ROWS, ...COLS].map(u => u.join(","));
    if (groups.some(g => lines.includes(g.join(",")))) return false;
    const acrossRows = groups.some(g => new Set(g.map(i => Math.floor(i / 27))).size > 1);
    const acrossCols = groups.some(g => new Set(g.map(i => Math.floor((i % 9) / 3))).size > 1);
    return acrossRows && acrossCols;
  }

  function randomLayout(rng, diagonals = false) {
    const base = new Layout(null, diagonals);
    for (;;) {
      const solution = randomSolution(rng, base);
      const reg = randomRegions(rng, solution);
      if (acceptable(reg)) return [new Layout(reg, diagonals), solution];
    }
  }

  function dig(solution, level, rng, layout = CLASSIC) {
    const puzzle = solution.slice();
    let givens = 81;
    const order = rng.shuffle(range(41));
    for (const i of order) {
      const cells = [...new Set([i, 80 - i])];
      if (givens - cells.length < MIN_GIVENS[level]) continue;
      const backup = cells.map(c => puzzle[c]);
      cells.forEach(c => { puzzle[c] = 0; });
      let ok = countSolutions(puzzle, 2, layout) === 1;
      if (ok && level < MAX_LEVEL) ok = rate(puzzle, level, layout) <= level;
      if (ok) givens -= cells.length;
      else cells.forEach((c, k) => { puzzle[c] = backup[k]; });
    }
    return puzzle;
  }

<script>
/* Sudoku – Web-Oberfläche. Raster auf einem Canvas (wie die PC-Version),

 *
 * Bedienung:
 *  Maus (PC, iPad mit Trackpad): Feld überfahren -> alle 9 Ziffern erscheinen,

(function () {

    bg: "#ffffff", thin: "#c9c9c9", thick: "#2b2b2b", given: "#4a4a4a", user: "#1f5fa8",
    note: "#3a3a3a", noteHl: "#1f5fa8", selected: "#d9d9d9", same: "#e4ecf7", error: "#c62828",
    errorBg: "#fdecea", hint: "#ff9800", overlay: "#f4f4f4", status: "#555555",
    hoverBox: "#111111", hoverDim: "#8c8c8c", unsure: "#ffd8a8", diag: "#e9e9e9", diagLine: "#a9bcd8",
  };

  const GROUP_COLORS = ["#f5b3b3", "#fbcf9a", "#f6ea8c", "#c4e6a8", "#a9e0db",

  const LEVELS = C.LEVEL_NAMES;

  };

    store.get(KEY_SET) || {});

  // ---------------------------------------------------------------- Zustand
  const S = {
    game: new C.Game(), selected: null, hover: null, clickNote: null, noteMode: false,

        else if (g.editing && S.unsure.has(i)) fill = COL.unsure;

    }

      ctx.fillStyle = COL.overlay; ctx.fillRect(w, w, W - 2 * w, W - 2 * w);
      ctx.fillStyle = COL.status; ctx.font = font(s * 0.45);
      ctx.fillText(S.generating ? "Erzeuge Rätsel …" : "Pause", W / 2, W / 2 - (S.generating ? 0 : s * 0.3));
      if (!S.generating) { ctx.font = font(s * 0.28); ctx.fillText("Tippen zum Fortsetzen", W / 2, W / 2 + s * 0.45); }

  }

  function drawHoverDigits(x, y, s, notes, active) {

        ctx.fillStyle = COL.bg;

      ctx.font = font(s * 0.22, isNote ? "bold" : "normal");
      ctx.fillText(String(d), cx, cy + 1);

  }

  const ICONS = {
